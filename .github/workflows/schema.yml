name: schema

on:
  pull_request:
    paths:
      - "packages/schema/**"
      - ".github/workflows/schema.yml"
      # Dependency bumps (black, isort, json-schema-to-typescript) can change generated output.
      - "uv.lock"
      - "pnpm-lock.yaml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "packages/schema/**"
      - ".github/workflows/schema.yml"
      # Dependency bumps (black, isort, json-schema-to-typescript) can change generated output.
      - "uv.lock"
      - "pnpm-lock.yaml"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: schema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/schema
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          uv sync --locked

      - name: Schemas, samples and Pydantic models
        run: uv run pytest

      - name: TypeScript types compile
        run: pnpm run typecheck

      - name: Generated files are up to date
        run: |
          pnpm run codegen
          if ! git diff --exit-code -- generated; then
            echo "::error::Generated files are stale. Run 'pnpm run codegen' in packages/schema and commit the result."
            exit 1
          fi
          if [ -n "$(git status --porcelain -- generated)" ]; then
            git status --porcelain -- generated
            echo "::error::Codegen produced untracked files. Run 'pnpm run codegen' and commit them."
            exit 1
          fi
