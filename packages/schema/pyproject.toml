[project]
name = "nomi-schema"
version = "0.1.0"
description = "Nomi shared data contracts: Pydantic models generated from packages/schema/schemas."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[dependency-groups]
dev = [
  "datamodel-code-generator>=0.26",
  "jsonschema>=4.23",
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generated/python/nomi_schema"]

[tool.pytest.ini_options]
testpaths = ["tests"]
