[project]
name = "nomi-pipeline"
version = "0.1.0"
description = "Nomi data and scoring pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nomi-schema",
    "pydantic-settings>=2.6.1",
    "typer>=0.15.1",
]

[tool.uv.sources]
nomi-schema = { workspace = true }

[project.scripts]
pipeline = "nomi_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
