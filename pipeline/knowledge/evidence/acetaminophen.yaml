  population: Nurses' Health Study, 70,971 US women aged 44-69 free of CVD or cancer at baseline, 12 years of follow-up; outcome nonfatal MI, fatal CHD, nonfatal and fatal stroke
  grade: cohort
  source:
    citation: Chan AT, Manson JE, Albert CM, et al. Nonsteroidal antiinflammatory drugs, acetaminophen, and the risk of cardiovascular events. Circulation 2006;113(12):1578-1587. PMID 16534006
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4789700/
    location: 'Roberts E et al. Paracetamol: not as safe as we thought? Ann Rheum Dis 2016;75:552-559, Table 1, Chan et al row'
    quote: Chan et al10 | USA | Cohort | 70 971 | 12 | Female registered nurses aged 30–55 years | Risk ratio | Cardiovascular AEs (confirmed or probable non-fatal myocardial infarction, non-fatal stroke, fatal coronary heart disease or fatal stroke) | 1–4 days/month use5–14 days/month use15–21 days/month use>22 days/month use | 0.98 (0.84 to 1.14)1.09 (0.91 to 1.30)1.22 (0.95 to 1.56)1.35 (1.14 to 1.59)
  selection_note: 'No meta-analysis pools paracetamol and MI or stroke (Roberts 2016 could not pool CV outcomes). Rule 22: every stratum the Chan abstract and the Roberts table report is recorded. Days a month and tablets a week: neither the abstract nor Roberts states the tablet strength, so dose_mg_per_day is null. Neither reports an overall any-use estimate; the full text (ahajournals, paywalled) could not be opened. Rule 20: the abstract and Roberts give no incidence in non-users. Women only.'
  match_note: 'Exposure is habitual use reported on questionnaires every two years over 12 years (abstract: women ''who provided medication data biennially since 1990''), so long_term (rule 22). Outcome is nonfatal MI, fatal CHD and nonfatal and fatal stroke, so mi_stroke; comparator is non-users.'
