relative_risks:
- ingredient: acetaminophen
  dimension: liver
  applies_to: {persona: all, condition: null, medication_type: null}
  outcome: acute_liver_injury
  outcome_match: true
  exposure_window: community_oral
  comparator: non_use
  dose_mg_per_day: [null, 2999]
  measure: OR
  estimate: 2.04
  ci95: [1.35, 3.09]
  exposure: paracetamol use, average daily dose <3000 mg (adjusted OR vs non-use)
  population: adults admitted with acute liver injury, 9 Italian hospitals 2010-2014; 179 cases, 1,770 matched controls; alcohol abuse an exclusion criterion
  grade: case_control
  source:
    citation: 'Donati M, Conforti A, Lenti MC, et al. Risk of acute and serious liver injury associated to nimesulide and other NSAIDs: data from drug-induced liver injury case-control study in Italy. Br J Clin Pharmacol 2016;82(1):238-248'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4917796/
    location: Table 5, paracetamol <3000 mg row
    quote: <3000 mg | 42 (23.46) | 265 (14.97) | 2.22 (1.48-3.15) | 2.04 (1.35-3.09)
  selection_note: No meta-analysis of acute liver injury at therapeutic doses was found. Only case-control study opened that reports dose-stratified adjusted ORs for hospitalised acute liver injury vs non-use; both strata of Table 5 are recorded (rule 14). The paper does not state that overdose cases were excluded, so pharmacist review should confirm. A Barcelona surveillance estimate (RR 7.0) is a case series with an exposure-prevalence denominator, so it ranks lower.
  match_note: Cases were adults admitted with a primary diagnosis of acute liver injury, matching section 1 at the serious level; exposure is paracetamol use before admission (community, oral); comparator is non-use among hospital controls without liver disease. Stratum <3000 mg/day.
