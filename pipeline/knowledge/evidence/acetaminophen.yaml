    url: https://pubmed.ncbi.nlm.nih.gov/16611205/
    location: Abstract
    quote: Among the twelve studies identified in the systematic review, estimates ranged from 0.2 through 2.0 with a summary estimate of 1.3 (95% CI, 1.2-1.5).
  selection_note: 'Most recent pooled estimate found, and the largest (12 studies). Rule 21: dose strata from the authors'' own nested case-control study (>2 g/day) and from Lewis et al. Br J Clin Pharmacol 2002 (IPD meta-analysis of 3 case-control studies, Table 4) are recorded as separate rows; the build picks by rule. Rule 20: meta-analysis summary; the abstract reports no incidence in non-users.'
  match_note: Outcome is upper GI complications (bleeding or perforation), section 1's outcome; exposure is paracetamol use in community studies; comparator non-use. The summary estimate is not dose-stratified.
