    location: Abstract (nested case-control study)
    quote: The RR was 3.6 (95% CI, 2.6-5.1) among paracetamol users of more than 2 g daily, whereas smaller doses did not increase the risk.
  selection_note: 'Rule 21: the dose stratum the abstract reports for the authors'' own nested case-control study. The lower stratum is described only in words ("smaller doses did not increase the risk"), with no number, so it is not recorded; the full text (Wiley) could not be opened (a bot check blocks it). The authors attribute much of the association to channelling and confounding. Rule 20: the abstract reports no incidence in non-users.'
  match_note: Outcome is upper GI complications (bleeding or perforation), section 1's outcome; exposure is current paracetamol use above 2,000 mg a day in general practice (community, oral); comparator non-use. Stratum >2,000 mg/day.
