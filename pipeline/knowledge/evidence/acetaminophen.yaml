- ingredient: acetaminophen
  dimension: gi_bleeding
  applies_to: {persona: all, condition: null, medication_type: null}
  outcome: upper_gi_bleeding
  outcome_match: true
  exposure_window: community_oral
  comparator: non_use
  dose_mg_per_day: null
  measure: RR
  estimate: 1.3
  ci95: [1.2, 1.5]
  exposure: paracetamol use vs non-use (summary of 12 studies)
  population: 12 observational studies 1980-2004 of upper GI complications (bleeding or perforation)
  grade: meta_analysis
  source:
    citation: Gonzalez-Perez A, Rodriguez LA. Upper gastrointestinal complications among users of paracetamol. Basic Clin Pharmacol Toxicol 2006;98(3):297-303. PMID 16611205
    url: https://pubmed.ncbi.nlm.nih.gov/16611205/
    location: Abstract
    quote: Among the twelve studies identified in the systematic review, estimates ranged from 0.2 through 2.0 with a summary estimate of 1.3 (95% CI, 1.2-1.5).
  selection_note: Most recent pooled estimate found, and the largest (12 studies). The alternative, Lewis et al. Br J Clin Pharmacol 2002;54:320-326 (IPD meta-analysis of 3 case-control studies, 2,472 cases), gives OR 1.2 (1.1-1.5) for any use and 1.2 (1.0-1.4) for <2000 mg/day, consistent with this. Gonzalez-Perez's own nested case-control found RR 3.6 (2.6-5.1) above 2 g/day and no increase below; the authors attribute much of the association to channelling/confounding. Not stratified by dose here because applies_to cannot express dose.
  match_note: Outcome is upper GI complications (bleeding or perforation), section 1's outcome; exposure is paracetamol use in community studies; comparator non-use. The summary estimate is not dose-stratified.
- ingredient: acetaminophen
  dimension: kidney
  applies_to: {persona: all, condition: null, medication_type: null}
  outcome: other
