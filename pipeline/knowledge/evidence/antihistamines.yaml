group: antihistamines
compiled: 2026-11-18
relative_risks:
  # --- sedation_falls: first-generation class estimate (Cho 2018 meta-analysis) ---
  - ingredient: diphenhydramine
    dimension: sedation_falls
    applies_to: {persona: adult_65_plus, condition: null, medication_type: null}
    measure: OR
    estimate: 2.03
    ci95: [1.49, 2.76]
    exposure: "first-generation antihistamine use"
    population: "elderly patients; 5 observational studies (3 case-control, 1 cohort, 1 case-crossover) through November 2016"
    grade: meta_analysis
    source:
      citation: "Cho H, Myung J, Suh HS, Kang HY. Osteoporos Int 2018;29(10):2163-2170"
      url: "https://pubmed.ncbi.nlm.nih.gov/30046925/"
      location: "Abstract, Results"
      quote: "First-generation antihistamine use showed significantly increased risk of injurious falls or fracture (odds ratio [OR] 2.03, 95% confidence interval [CI] 1.49-2.76, heterogeneity: p = 0.41, I2 = 0%)."
    selection_note: "Class estimate for first-generation antihistamines; the only meta-analysis of antihistamines and injurious falls or fracture found (PubMed search 2026-11-18). Outcome is injurious falls or fracture combined, which matches the v1 outcome. Authors note the pooled studies were largely unadjusted. No estimate found for adults 18-64 or for co-medication with sedatives."
