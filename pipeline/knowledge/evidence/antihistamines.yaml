      location: "Abstract"
      quote: "for doxylamine exposure, the summary relative risk and odds ratio were 0.94 (95% CI: 0.80-1.10) and 1.07 (95% CI: 0.93-1.23), respectively."
    selection_note: "Ingredient-specific pooled estimate for congenital malformations (cohort studies, RR). Preferred over the class estimate of Etwel 2017 because it is doxylamine-specific. Breastfeeding: no study reports a quantitative risk of serious neonatal harm, so no breastfeeding row."
