  # --- anticholinergic_cognitive: diphenhydramine (Agostini 2001 cohort) ---
  - ingredient: diphenhydramine
    dimension: anticholinergic_cognitive
    applies_to: {persona: adult_65_plus, condition: null, medication_type: null}
    outcome: delirium_hospital
    outcome_match: false
    exposure_window: inpatient
    comparator: non_use
    dose_mg_per_day: null
    match_note: "Inpatient: 426 'hospitalized medical patients' aged 70+ who 'received diphenhydramine during hospitalization', so rule 11 drops it. Outcome is 'any delirium symptoms' on daily CAM ratings, broader than delirium, so rule 10 is not met. Comparator: non-exposed inpatients."
    measure: RR
    estimate: 1.7
    ci95: [1.3, 2.3]
    exposure: "diphenhydramine received during hospitalization vs not"
    population: "426 hospitalized medical patients aged 70 years or older, prospective cohort, one US university hospital"
    grade: cohort
    source:
      citation: "Agostini JV, Leo-Summers LS, Inouye SK. Arch Intern Med 2001;161(17):2091-2097"
      url: "https://pubmed.ncbi.nlm.nih.gov/11570937/"
      location: "Abstract, Results"
      quote: "The diphenhydramine-exposed group was at an increased risk for any delirium symptoms (relative risk [RR], 1.7; 95% confidence interval [CI], 1.3-2.3)"
    selection_note: "Ingredient-specific cohort with CAM-rated delirium symptoms vs non-use. Reisinger 2023 (below) pools this question for diphenhydramine and is the rule 13 meta-analysis; both are inpatient or institutional and neither is used. No community estimate of delirium needing hospital care with first-generation antihistamines in older adults was found (PubMed 2026-11-18: antihistamine, diphenhydramine, chlorpheniramine, doxylamine AND delirium/confusion AND cohort/case-control/case-crossover/meta-analysis; results were inpatient, emergency-department-administered or case reports). No estimate found for adults under 65 or for the glaucoma or enlarged_prostate modifiers."
  - ingredient: diphenhydramine
    dimension: anticholinergic_cognitive
    applies_to: {persona: all, condition: null, medication_type: null}
    outcome: other
    outcome_match: false
    exposure_window: inpatient
    comparator: non_use
    dose_mg_per_day: null
    match_note: "Exposure is not community use: the two pooled cohorts are 'long term care facilities vs. mixed surgical' (postoperative medication in hospital and residents' medication), classed inpatient. Outcome is incident delirium found by research screening (CAM) during the stay, not delirium needing hospital care, so outcome other and rule 10 is not met."
    measure: OR
    estimate: 1.5
    ci95: [0.64, 3.54]
    exposure: "diphenhydramine use recorded in two prospective cohorts (long-term care residents' medication; postoperative medication in mixed surgical patients) vs no use"
    population: "2 prospective cohorts pooled within a systematic review of 31 prospective studies of incident delirium in adults, searched October 2009 to June 2020"
    grade: meta_analysis
    source:
      citation: "Reisinger M, Reininghaus EZ, Biasi J, Fellendorf FT, Schoberer D. Delirium-associated medication in people at risk: A systematic update review, meta-analyses, and GRADE-profiles. Acta Psychiatr Scand 2023;147(1):16-42"
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC10092229/"
      location: "Results, H1-antihistamines paragraph; GRADE evidence profile, Diphenhydramine row ('Pooled aOR 1.50 (0.64 to 3.54)')"
      quote: "The effect estimate indicates an insignificant positive association (aOR 1.50, 95% CI: 0.64–3.54; AR: 35 more per 1000, 95% CI: 27 fewer to 153 more)."
    selection_note: "Only meta-analysis with a diphenhydramine-specific pooled delirium estimate (rule 13); full text opened via Europe PMC. GRADE very low. Its H1-antihistamine class estimate (aOR 0.75, 0.14-4.16) mixes a class exposure with diphenhydramine, so it is not used for other first-generation agents. Not used: institutional and postoperative exposure, and delirium found by screening rather than delirium needing hospital care."

  # --- pregnancy_lactation ---
  - ingredient: diphenhydramine
    dimension: pregnancy_lactation
    applies_to: {persona: pregnant, condition: null, medication_type: null}
    outcome_match: true
    exposure_window: community_oral
    comparator: non_use
    dose_mg_per_day: null
    match_note: "Outcome is the specific fetal harm studied (major malformation). Exposure is first-trimester maternal use outside hospital; comparator unexposed control population."
    measure: OR
    estimate: 1.07
    ci95: [0.98, 1.16]
    exposure: "first-trimester H1 antihistamine exposure"
    population: "cohort studies within a meta-analysis of 37 studies published to December 2015"
    grade: meta_analysis
    source:
      citation: "Etwel F, Faught LH, Rieder MJ, Koren G. Drug Saf 2017;40(2):121-132"
      url: "https://pubmed.ncbi.nlm.nih.gov/27878468/"
      location: "Abstract, Results"
      quote: "In cohort studies, the risk of major malformation in the offspring of women exposed to H1 antihistamines was not higher than that of the control population (OR 1.07; 95% CI 0.98-1.16)."
    selection_note: "Class estimate for all H1 antihistamines (major malformation). Most recent and largest meta-analysis; per-drug results not available in the accessible abstract. Cohort pooled estimate preferred over case-control (OR 1.05; 95% CI 0.90-1.23) as it is the primary reported result. Breastfeeding: no study reports a quantitative risk of serious neonatal harm, so no breastfeeding row."
