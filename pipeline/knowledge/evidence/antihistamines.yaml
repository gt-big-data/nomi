    selection_note: "Class estimate. The fexofenadine-specific Danish cohort (Andersson et al. JAMA Pediatr 2020;174:e201316) compares fexofenadine with cetirizine (prevalence OR 1.06; 95% CI 0.81-1.37), not with non-use, so it does not give an RR vs no use. Breastfeeding: no study reports a quantitative risk of serious neonatal harm, so no breastfeeding row."
insufficient:
  - ingredient: doxylamine
    dimension: anticholinergic_cognitive
    reason: "No doxylamine-specific delirium estimate and no meta-analysis with a first-generation class estimate. Only class-level evidence is Bridgman et al. J Am Geriatr Soc 2025;73:3475 (cross-sectional, physician-preference design; encounter-level sensitivity OR 1.45, 95% CI 1.38-1.51, all first-generation agents, inpatients 65+), which is not a cohort/case-control or meta-analysis and cannot establish temporality. Searched PubMed (antihistamine/doxylamine AND delirium/confusion)."
  - ingredient: chlorpheniramine
    dimension: anticholinergic_cognitive
    reason: "No chlorpheniramine-specific delirium estimate and no meta-analysis with a class estimate. Bridgman et al. 2025 (cross-sectional, class-level OR 1.45, 95% CI 1.38-1.51 at encounter level) noted for pharmacist review but not admissible under v1 grades. Searched PubMed."
  - ingredient: cetirizine
    dimension: anticholinergic_cognitive
    reason: "No study reports delirium or acute confusion risk for cetirizine vs non-use. Searched PubMed (cetirizine AND delirium/confusion AND cohort/case-control/meta-analysis)."
  - ingredient: levocetirizine
    dimension: anticholinergic_cognitive
    reason: "No study reports delirium risk for levocetirizine vs non-use; enlarged_prostate modifier also has no quantitative estimate. Searched PubMed."
  - ingredient: loratadine
    dimension: anticholinergic_cognitive
    reason: "No study reports delirium risk for loratadine vs non-use. Searched PubMed."
  - ingredient: cetirizine
    dimension: sedation_falls
    reason: "No estimate vs non-use. Taniguchi et al. Br J Clin Pharmacol 2026;92:2230 (1.3 million Japanese patients) compares higher-sedation (cetirizine, levocetirizine, loratadine) with lower-sedation second-generation agents and finds no difference (risk difference -0.0%, 95% CI -0.1 to 0.0), but has no non-user comparator. Cho 2018 meta-analysis gives no second-generation pooled estimate in its abstract."
  - ingredient: levocetirizine
    dimension: sedation_falls
    reason: "Same as cetirizine: only head-to-head second-generation comparison (Taniguchi 2026, no difference), no estimate vs non-use."
  - ingredient: cetirizine
    dimension: kidney
    reason: "No study reports acute kidney injury risk with cetirizine vs non-use (v0 rating reflects renal dose adjustment, not nephrotoxicity). Searched PubMed (cetirizine AND kidney/renal AND cohort/case-control/meta-analysis)."
  - ingredient: levocetirizine
    dimension: kidney
    reason: "No study reports acute kidney injury risk with levocetirizine vs non-use (v0 rating reflects renal clearance/dose adjustment). Searched PubMed."
  - ingredient: fexofenadine
    dimension: kidney
    reason: "No study reports acute kidney injury risk with fexofenadine vs non-use (v0 rating reflects renal dose adjustment). Searched PubMed."
  - ingredient: loratadine
    dimension: kidney
    reason: "v0 has only a kidney_disease modifier (dose adjustment); no study reports acute kidney injury risk for loratadine. Searched PubMed."
  - ingredient: cetirizine
    dimension: liver
    reason: "v0 has only a liver_disease modifier; no study reports a quantitative acute liver injury risk for cetirizine vs non-use (case reports only)."
  - ingredient: loratadine
    dimension: liver
    reason: "v0 has only a liver_disease modifier (dose adjustment); no study reports a quantitative acute liver injury risk for loratadine."
