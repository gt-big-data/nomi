    selection_note: "Ingredient-specific meta-analysis of the specific harm suspected for loratadine (hypospadias); adjusted OR used. Chosen over the class estimate because it is loratadine-specific. Breastfeeding: no study reports a quantitative risk of serious neonatal harm, so no breastfeeding row."
