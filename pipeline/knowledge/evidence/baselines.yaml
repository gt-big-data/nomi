  # ---------------------------------------------------------------- anticoagulant_bleeding
  - dimension: anticoagulant_bleeding
    persona: all
    condition: null
    medication_type: anticoagulants
    outcome: major_bleeding
    outcome_match: true
    excludes_class_users: false
    annual_incidence: 0.082
    as_reported: "8.2 (95% CI 4.5-11.8) per 100 person-years at 1 year -> 8.2 / 100 = 0.082 per person-year"
    population: "Canada and 4 European countries, national EHR/claims registries; 358,143 new oral factor Xa inhibitor users aged >=18 (AF, VTE, valve replacement, other)"
    source:
      citation: "Cohen AT, Welsh RC, Leentjens J, Canbay A, et al. Incidence and outcomes of major bleeding among first-time oral factor Xa inhibitor users: multinational observational cohort studies. Res Pract Thromb Haemost 2026;10:103351. doi:10.1016/j.rpth.2026.103351"
      url: "https://europepmc.org/article/PMC/PMC12990360"
      location: "Abstract, Results; Essentials box"
      quote: "The pooled incidence rate of major bleeding was 11.0 per 100 person-years (95% CI, 6.1-15.9) at 3 months, 8.2 (95% CI, 4.5-11.8) at 1 year, and 6.7 (95% CI, 3.7-9.7) at 3 years"
    selection_note: "Largest multinational real-world cohort opened; major bleeding defined as ICD-coded bleeding leading to hospital admission, including fatal bleeds. 1-year rate chosen as the annual figure; the 3-month rate (11.0) is higher because early-treatment risk is front-loaded. Factor Xa inhibitors only (apixaban, rivaroxaban, edoxaban), not warfarin or antiplatelets. Wide CI reflects between-country heterogeneity."
    match_note: "Major bleeding leading to admission or death in anticoagulant users is the section-1 outcome; GI bleeds are the largest share (the text gives 5.4 of 11.0 per 100 person-years at 3 months, about half, and says GI bleeds were also the most common at 1 and 3 years, whose site rates are only in Figure 4), so rule 16 drops the separate gi_bleeding term for these profiles; adults of all ages pooled, so persona all and rule 15 does not apply; the population is all class users by design."

