group: baselines
compiled: 2026-11-18
baselines:
  # ---------------------------------------------------------------- liver
  - dimension: liver
    persona: all
    condition: null
    medication_type: null
    annual_incidence: 0.0000113
    as_reported: "1.13/100 000 person-years -> 1.13 / 100,000 = 0.0000113 per person-year"
    population: "Germany, AOK statutory health insurance (26.5 million insured), 2014-2018, all ages, extrapolated to the German population; ICD/OPS-coded acute liver failure"
    source:
      citation: "Weiler N, Schlotmann A, Schnitzbauer AA, Zeuzem S, Welker MW. The Epidemiology of Acute Liver Failure. Dtsch Arztebl Int 2020;117:43-50. doi:10.3238/arztebl.2020.0043"
      url: "https://europepmc.org/article/MED/32036852"
      location: "Abstract, Results"
      quote: "The calculated incidence of ALF was 1.13/100 000 person-years, representing 4652 cases."
    selection_note: "Largest Western claims-based population estimate opened. Outcome is acute liver FAILURE only, not the broader hospitalized acute liver injury, so it understates the v1 liver outcome. Not age-stratified in the abstract (age peak in ninth decade per search snippet, not verified), so recorded as persona all. A Thai nationwide hospital database (BMC Gastroenterol 2019, PMC6348628) reported 62.9 per million per year; not chosen because coding validity and etiology mix (69% indeterminate) differ from the OTC-using Western population."

  # ---------------------------------------------------------------- gi_bleeding
  - dimension: gi_bleeding
    persona: adult_18_64
    condition: null
    medication_type: null
    annual_incidence: 0.00048
    as_reported: "48 per 100,000 per year (age 40-59) -> 48 / 100,000 = 0.00048 per person-year"
    population: "Iceland, greater Reykjavik metropolitan area residents, 2010, all patients undergoing upper GI endoscopy at the National University Hospital; age band 40-59"
    source:
      citation: "Hreinsson JP, Kalaitzakis E, Gudmundsson S, Bjornsson ES. Upper gastrointestinal bleeding: incidence, etiology and outcomes in a population-based setting. Scand J Gastroenterol 2013;48:439-447. doi:10.3109/00365521.2012.763174"
      url: "https://europepmc.org/article/PMC/PMC3613943"
      location: "Table I"
      quote: "Age standardized incidence rate 18–24 30 25–39 15 40–59 48 60–79 213 80–105 570"
    selection_note: "Only opened population-based source with a tabulated age-specific UGIB incidence. The 40-59 band stands in for adult_18_64 (it is the upper, higher-risk part of that range; 18-24 = 30 and 25-39 = 15 per 100,000). Small single-year study (132 incident cases). The Dutch national registry (Bedene 2022, BMJ Open Gastroenterol) gives age bands only in a figure, so it could not be quoted."
  - dimension: gi_bleeding
    persona: adult_65_plus
    condition: null
    medication_type: null
    annual_incidence: 0.00213
    as_reported: "213 per 100,000 per year (age 60-79) -> 213 / 100,000 = 0.00213 per person-year"
    population: "Iceland, greater Reykjavik metropolitan area residents, 2010; age band 60-79"
    source:
      citation: "Hreinsson JP, Kalaitzakis E, Gudmundsson S, Bjornsson ES. Upper gastrointestinal bleeding: incidence, etiology and outcomes in a population-based setting. Scand J Gastroenterol 2013;48:439-447. doi:10.3109/00365521.2012.763174"
      url: "https://europepmc.org/article/PMC/PMC3613943"
      location: "Table I"
      quote: "Age standardized incidence rate 18–24 30 25–39 15 40–59 48 60–79 213 80–105 570"
    selection_note: "60-79 band stands in for adult_65_plus; 80-105 is 570 per 100,000, so this understates risk for the oldest. Same source and caveats as the adult_18_64 row."
  - dimension: gi_bleeding
    persona: all
    condition: null
    medication_type: null
    annual_incidence: 0.0013
    as_reported: "260 per 100 000 inhabitants over 2 years (2017-2018) -> 260 / 2 = 130 per 100,000 per year = 0.0013 per person-year"
    population: "Netherlands, total population (17.47 million, all ages), 2017-2018, linked national hospital and population registries; severe UGIB"
    source:
      citation: "Bedene A, van Dorp ELA, Rosendaal FR, Dahan A, Lijfering WM. Risk of drug-related upper gastrointestinal bleeding in the total population of the Netherlands: a time-trend analysis. BMJ Open Gastroenterol 2022;9:e000733. doi:10.1136/bmjgast-2021-000733"
      url: "https://europepmc.org/article/PMC/PMC8753354"
      location: "Results, 'Risk of severe UGIB in the four different (sub)populations'; Table 2"
      quote: "In the total Dutch population, the 2 years’ worth cumulative incidence of severe UGIB was 199 per 100 000 inhabitants (95% CI 197 to 201) in 2013–2014, and in 2017–2018 it was 260 per 100 000 inhabitants (95% CI 258 to 263)"
    selection_note: "Largest and most recent national registry opened (whole Dutch population). Biennial cumulative incidence halved to an annual rate; cumulative incidence and rate are near-identical at this magnitude. All ages including children, so it is a fallback for personas without an age-specific row."

  # ---------------------------------------------------------------- kidney
  - dimension: kidney
    persona: adult_18_64
    condition: null
    medication_type: null
    annual_incidence: 0.0089
    as_reported: "89 per 10 000/year (age 40-69, Grampian 2012) -> 89 / 10,000 = 0.0089 per person-year"
    population: "Scotland, Grampian region, all residents aged >=15, 2012 (482,444 adults); biochemistry-defined AKI episodes (KDIGO-based, hospital and community tests); age band 40-69"
    source:
      citation: "Sawhney S, Robinson HA, van der Veer SN, et al. Acute kidney injury in the UK: a replication cohort study of the variation across three regional populations. BMJ Open 2018;8:e019435. doi:10.1136/bmjopen-2017-019435"
      url: "https://europepmc.org/article/PMC/PMC6042563"
      location: "Table 3, 'People with AKI in age strata' row 40-69 years, Grampian 2012 column"
      quote: "People with AKI in age strata ≥70 years 3205 (562) 3561 (587) 3705 (572) 3785 (584) 1299 (544) 40–69 years 1765 (88) 1903 (89) 2021 (89) 1699 (89) 740 (92) <40 years 392 (22) 466 (25) 551 (29) 363 (23) 169 (19)"
    selection_note: "Population-based, all-resident denominator, age-stratified, replicated across 3 UK regions (40-69 rate 88-92 in every dataset). 40-69 stands in for adult_18_64; the <40 band is 29 per 10,000, so this overstates risk for younger adults. Outcome is biochemical AKI (includes community-detected episodes, not only hospital AKI); 'AKI using hospital tests only' was 93 vs 130 per 10,000 overall in Grampian 2012, so roughly 70% are hospital-detected."
  - dimension: kidney
    persona: adult_65_plus
    condition: null
    medication_type: null
    annual_incidence: 0.0572
    as_reported: "572 per 10 000/year (age >=70, Grampian 2012) -> 572 / 10,000 = 0.0572 per person-year"
    population: "Scotland, Grampian region residents, 2012; age band >=70; biochemistry-defined AKI"
    source:
      citation: "Sawhney S, Robinson HA, van der Veer SN, et al. Acute kidney injury in the UK: a replication cohort study of the variation across three regional populations. BMJ Open 2018;8:e019435. doi:10.1136/bmjopen-2017-019435"
      url: "https://europepmc.org/article/PMC/PMC6042563"
      location: "Table 3, 'People with AKI in age strata' row >=70 years, Grampian 2012 column"
      quote: "People with AKI in age strata ≥70 years 3205 (562) 3561 (587) 3705 (572) 3785 (584) 1299 (544)"
    selection_note: ">=70 stands in for adult_65_plus (65-69 fall in the source's 40-69 band). Includes community-detected biochemical AKI, so it is higher than hospital-coded AKI. Consistent 544-587 across all five datasets."
  - dimension: kidney
    persona: all
    condition: kidney_disease
    medication_type: null
    annual_incidence: 0.0756
    as_reported: "756 per 10 000/year among tested people with baseline eGFR 45-59 (Grampian 2012) -> 756 / 10,000 = 0.0756 per person-year"
    population: "Scotland, Grampian 2012, residents with >=2 creatinine tests within 365 days and baseline eGFR 45-59 mL/min/1.73 m2 (CKD stage 3a); rate within tested individuals at risk"
    source:
      citation: "Sawhney S, Robinson HA, van der Veer SN, et al. Acute kidney injury in the UK: a replication cohort study of the variation across three regional populations. BMJ Open 2018;8:e019435. doi:10.1136/bmjopen-2017-019435"
      url: "https://europepmc.org/article/PMC/PMC6042563"
      location: "Table 3, 'People with AKI in eGFR strata among people with at least two tests within 365 days (rates expressed within strata of tested individuals at risk)'"
      quote: "Baseline eGFR 45–59 809 (673) 940 (496) 894 (756) 1044 (618) 323 (607) Baseline eGFR 30–44 597 (1222) 723 (1000) 661 (1282) 732 (1097) 202 (867) Baseline eGFR <30 344 (2064) 393 (1861) 303 (1781) 423 (1778) 171 (1921)"
    selection_note: "Stage 3a (eGFR 45-59) chosen as the most common CKD stage; more advanced CKD is higher (eGFR 30-44: 1282, <30: 1781 per 10,000 in Grampian 2012). Denominator is tested people, not all residents, which inflates the rate (people are tested because they are unwell). Grampian 2012 chosen for consistency with the age rows; the eGFR 45-59 rate ranges 496-756 across datasets."

  # ---------------------------------------------------------------- cardiovascular_bp
  - dimension: cardiovascular_bp
    persona: all
    condition: null
    medication_type: null
    annual_incidence: 0.00371
    as_reported: "acute coronary syndrome 190 + stroke 181 per 100 000 person years (2017-19) = 371 per 100,000 -> 0.00371 per person-year"
    population: "UK, Clinical Practice Research Datalink (GOLD and Aurum, ~20% of UK population), 2017-2019; first diagnosis; age-sex standardised to the 2013 European standard population"
    source:
      citation: "Conrad N, Molenberghs G, Verbeke G, et al. Trends in cardiovascular disease incidence among 22 million people in the UK over 20 years: population based study. BMJ 2024;385:e078523. doi:10.1136/bmj-2023-078523"
      url: "https://europepmc.org/article/PMC/PMC11203392"
      location: "Results, first paragraph of incidence results; Fig 1"
      quote: "followed by acute coronary syndrome (190 per 100 000 person years), venous thromboembolism (183 per 100 000 person years), and stroke (181 per 100 000 patient years)"
    selection_note: "Largest recent population source opened (22 million). Sum of two first-diagnosis rates; people with both are counted twice, a small overstatement. Heart failure (367 per 100 000 person years, same sentence) is excluded because it is a first diagnosis, not an admission, and would double the baseline; flag for pharmacist decision. Age-specific rates exist only in figures (Fig 3, Fig 4) and supplement, which could not be quoted, so no age-band rows."

  # ---------------------------------------------------------------- anticholinergic_cognitive
  - dimension: anticholinergic_cognitive
    persona: adult_65_plus
    condition: null
    medication_type: null
    annual_incidence: 0.0331
    as_reported: "33.1 (95% CI 31.5-34.9) per 1000 person-years -> 33.1 / 1,000 = 0.0331 per person-year"
    population: "Norway, HUNT4 70+ population cohort (9956 community participants aged >=70), followed 2017-19 to 31 Dec 2023; in-hospital delirium by DSM-5 chart review, weighted for non-participation"
    source:
      citation: "Frich W, Verlo KR, Borda MG, et al. Population-based incidence rate of in-hospital delirium in older adults in Norway - a HUNT study. Age Ageing 2026;55:afag297. doi:10.1093/ageing/afag297"
      url: "https://europepmc.org/article/PMC/PMC13654089"
      location: "Abstract, Results"
      quote: "The weighted incidence rate was 33.1 (95% CI 31.5–34.9) per 1000 person-years and increased with age from 11.4 (age 70–74) to 109.0 (age ≥90) per 1000 person-years."
    selection_note: "Only population-based, person-year delirium incidence found; community-dwelling older adults, hospital-diagnosed. Aged >=70 stands in for adult_65_plus; age 70-74 alone is 11.4 per 1000 PY, so 65-69 is likely lower than 33.1. Chart review finds ~10x more than ICD coding (11.9% coded), so an ICD-based RR applied to this baseline may mismatch."

