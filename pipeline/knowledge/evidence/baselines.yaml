  # ---------------------------------------------------------------- anticoagulant_bleeding
  - dimension: anticoagulant_bleeding
    persona: all
    condition: null
    medication_type: anticoagulants
    annual_incidence: 0.082
    as_reported: "8.2 (95% CI 4.5-11.8) per 100 person-years at 1 year -> 8.2 / 100 = 0.082 per person-year"
    population: "Canada and 4 European countries, national EHR/claims registries; 358,143 new oral factor Xa inhibitor users aged >=18 (AF, VTE, valve replacement, other)"
    source:
      citation: "Cohen AT, Welsh RC, Leentjens J, Canbay A, et al. Incidence and outcomes of major bleeding among first-time oral factor Xa inhibitor users: multinational observational cohort studies. Res Pract Thromb Haemost 2026;10:103351. doi:10.1016/j.rpth.2026.103351"
      url: "https://europepmc.org/article/PMC/PMC12990360"
      location: "Abstract, Results; Essentials box"
      quote: "The pooled incidence rate of major bleeding was 11.0 per 100 person-years (95% CI, 6.1-15.9) at 3 months, 8.2 (95% CI, 4.5-11.8) at 1 year, and 6.7 (95% CI, 3.7-9.7) at 3 years"
    selection_note: "Largest multinational real-world cohort opened; major bleeding defined as critical-site bleeding or bleeding leading to hospitalization or death (matches v1). 1-year rate chosen as the annual figure; the 3-month rate (11.0) is higher because early-treatment risk is front-loaded. Factor Xa inhibitors only (apixaban, rivaroxaban, edoxaban), not warfarin or antiplatelets. Wide CI reflects between-country heterogeneity; authors include industry affiliations (not verified in detail)."

insufficient:
  - {dimension: liver, persona: adult_18_64, condition: null, reason: "No opened source gives an age-banded population incidence of hospitalized acute liver injury or ALF; Weiler 2020 (Germany) abstract is all-ages only. Use the persona all row."}
  - {dimension: liver, persona: adult_65_plus, condition: null, reason: "Same as adult_18_64; no age-specific rate quotable."}
  - {dimension: liver, persona: child_2_5, condition: null, reason: "Pediatric ALF in California (Lee 2026, Hepatol Commun) reported as 16.75 per 100,000 live births, which cannot be converted to per person-year by age band; German ESPED pediatric figure (3.7 per million children per year) seen only in a search snippet, source not opened. Applies to all child personas and under_2."}
  - {dimension: liver, persona: all, condition: liver_disease, reason: "No population source opened giving incidence of acute liver injury/ALF (or acute-on-chronic liver failure) per person-year in people with chronic liver disease."}
  - {dimension: liver, persona: all, condition: heavy_alcohol_use, reason: "No population source opened giving incidence of acute liver injury in heavy drinkers per person-year."}
  - {dimension: liver, persona: pregnant, condition: null, reason: "No population incidence opened."}
  - {dimension: gi_bleeding, persona: teen_12_17, condition: null, reason: "Hreinsson 2013 starts at 18; Bedene 2022 has 0-15 and 15-25 bands only in a figure, not quotable."}
  - {dimension: gi_bleeding, persona: child_6_11, condition: null, reason: "No quotable pediatric population UGIB incidence opened. Applies also to child_2_5 and under_2."}
  - {dimension: gi_bleeding, persona: pregnant, condition: null, reason: "No population incidence opened."}
  - {dimension: gi_bleeding, persona: all, condition: stomach_ulcer_or_bleeding, reason: "Searched Europe PMC for population rebleeding/recurrent ulcer bleeding incidence per person-year after prior peptic ulcer; no source opened that states it. Korean NHIS (34.98 per 100,000 PY) and Swedish register rates are for first ulcer bleeding in the general population, not people with prior ulcer."}
  - {dimension: kidney, persona: teen_12_17, condition: null, reason: "Sawhney 2018 youngest band is <40 (15-39, 29 per 10,000); not specific to teens. JAMA Netw Open 2026 pediatric AKI hospitalization study found but not opened. Applies also to child bands and under_2."}
  - {dimension: kidney, persona: pregnant, condition: null, reason: "No population incidence opened."}
  - {dimension: cardiovascular_bp, persona: adult_18_64, condition: null, reason: "Conrad 2024 age-specific rates appear only in figures/supplement; Swedish birth-cohort study (Lancet Reg Health Eur 2026) gives single-year-of-age MI rates for men only; no quotable combined MI+stroke rate by age band."}
  - {dimension: cardiovascular_bp, persona: adult_65_plus, condition: null, reason: "Same as adult_18_64. ARIC stroke-only rates (65+) seen in a search snippet, not opened."}
  - {dimension: cardiovascular_bp, persona: teen_12_17, condition: null, reason: "No source opened; events are very rare in children/teens. Applies to child bands and under_2."}
  - {dimension: cardiovascular_bp, persona: all, condition: hypertension, reason: "No opened source gives MI+stroke incidence per person-year in people with hypertension."}
  - {dimension: cardiovascular_bp, persona: all, condition: heart_disease, reason: "No opened source gives recurrent MI/stroke incidence per person-year in people with established heart disease."}
  - {dimension: cardiovascular_bp, persona: pregnant, condition: null, reason: "No population incidence opened."}
  - {dimension: anticholinergic_cognitive, persona: adult_18_64, condition: null, reason: "HUNT study covers >=70 only; Frich 2026 notes population delirium incidence estimates are scarce. No younger-adult source found."}
  - {dimension: anticholinergic_cognitive, persona: teen_12_17, condition: null, reason: "No population incidence found. Applies to child bands, under_2 and pregnant."}
  - {dimension: sedation_falls, persona: adult_18_64, condition: null, reason: "NEISS-AIP/WISQARS age-specific rates for 18-64 not found in an openable publication; WISQARS interactive tool not fetchable."}
  - {dimension: sedation_falls, persona: pregnant, condition: null, reason: "No population incidence opened."}
  - {dimension: serotonergic_interactions, persona: all, condition: null, reason: "No general-population incidence of serotonin syndrome found; Europe PMC search returned only drug-exposed cohorts (linezolid, tedizolid, fentanyl, fluvoxamine) with incidence per patient, not per person-year in the population."}
  - {dimension: anticoagulant_bleeding, persona: adult_65_plus, condition: null, reason: "Cohen 2026 abstract gives only the pooled all-adult rate; age-specific rates not quoted."}
  - {dimension: anticoagulant_bleeding, persona: all, condition: null, reason: "medication_type antiplatelets: no population major-bleeding incidence for antiplatelet users opened."}
