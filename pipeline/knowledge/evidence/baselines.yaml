  # ---------------------------------------------------------------- anticoagulant_bleeding
  - dimension: anticoagulant_bleeding
    persona: all
    condition: null
    medication_type: anticoagulants
    outcome: major_bleeding
    outcome_match: true
    excludes_class_users: false
    age_standardised: false
    stratum_population: doac_users
    annual_incidence: 0.082
    as_reported: "8.2 (95% CI 4.5-11.8) per 100 person-years at 1 year -> 8.2 / 100 = 0.082 per person-year"
    population: "Canada and 4 European countries, national EHR/claims registries; 358,143 new oral factor Xa inhibitor users aged >=18 (AF, VTE, valve replacement, other)"
    source:
      citation: "Cohen AT, Welsh RC, Leentjens J, Canbay A, et al. Incidence and outcomes of major bleeding among first-time oral factor Xa inhibitor users: multinational observational cohort studies. Res Pract Thromb Haemost 2026;10:103351. doi:10.1016/j.rpth.2026.103351"
      url: "https://europepmc.org/article/PMC/PMC12990360"
      location: "Abstract, Results; Essentials box"
      quote: "The pooled incidence rate of major bleeding was 11.0 per 100 person-years (95% CI, 6.1-15.9) at 3 months, 8.2 (95% CI, 4.5-11.8) at 1 year, and 6.7 (95% CI, 3.7-9.7) at 3 years"
    selection_note: "Largest multinational real-world cohort opened; major bleeding defined as ICD-coded bleeding leading to hospital admission, including fatal bleeds. 1-year rate chosen as the annual figure; the 3-month rate (11.0) is higher because early-treatment risk is front-loaded. Factor Xa inhibitors only (apixaban, rivaroxaban, edoxaban), not warfarin or antiplatelets. Wide CI reflects between-country heterogeneity."
    match_note: "Major bleeding leading to admission or death in anticoagulant users is the section-1 outcome; GI bleeds are the largest share (the text gives 5.4 of 11.0 per 100 person-years at 3 months, about half, and says GI bleeds were also the most common at 1 and 3 years, whose site rates are only in Figure 4), so rule 16 drops the separate gi_bleeding term for these profiles; adults of all ages pooled, so persona all and rule 15 does not apply; the population is all class users by design. Rule 25: the source states its cohort is first-time users of oral factor Xa inhibitors (apixaban, rivaroxaban, edoxaban), which are direct oral anticoagulants, so stratum_population is doac_users (no vitamin K antagonist users; dabigatran, a DOAC that is not a factor Xa inhibitor, is not included). Crude pooled rate, not age-standardised."

insufficient:
  - {dimension: liver, persona: adult_18_64, condition: null, reason: "No opened source gives an age-banded population incidence of hospitalized acute liver injury or acute liver failure (Bjornsson 2013 and Weiler 2020 abstracts are all-ages; de Abajo 2004 gives no age-specific rates). The persona all rows apply."}
  - {dimension: liver, persona: adult_65_plus, condition: null, reason: "Same as adult_18_64; no age-specific rate quotable."}
  - {dimension: liver, persona: child_2_5, condition: null, reason: "Pediatric ALF in California (Lee 2026, Hepatol Commun) reported as 16.75 per 100,000 live births, which cannot be converted to per person-year by age band; German ESPED pediatric figure (3.7 per million children per year) seen only in a search snippet, source not opened. Applies to all child personas and under_2."}
  - {dimension: liver, persona: all, condition: liver_disease, reason: "No population source opened giving incidence of acute liver injury/ALF (or acute-on-chronic liver failure) per person-year in people with chronic liver disease."}
  - {dimension: liver, persona: all, condition: heavy_alcohol_use, reason: "No population source opened giving incidence of acute liver injury in heavy drinkers per person-year."}
  - {dimension: liver, persona: pregnant, condition: null, reason: "No population incidence opened."}
  - {dimension: gi_bleeding, persona: teen_12_17, condition: null, reason: "Hreinsson 2013 starts at 18; Bedene 2022 has 0-15 and 15-25 bands only in a figure, not quotable."}
  - {dimension: gi_bleeding, persona: child_6_11, condition: null, reason: "No quotable pediatric population UGIB incidence opened. Applies also to child_2_5 and under_2."}
  - {dimension: gi_bleeding, persona: pregnant, condition: null, reason: "No population incidence opened."}
  - {dimension: gi_bleeding, persona: all, condition: stomach_ulcer_or_bleeding, reason: "Searched Europe PMC for population rebleeding/recurrent ulcer bleeding incidence per person-year after prior peptic ulcer; no source opened that states it. Korean NHIS (34.98 per 100,000 PY) and Swedish register rates are for first ulcer bleeding in the general population, not people with prior ulcer."}
  - {dimension: gi_bleeding, persona: adult_18_64, condition: null, reason: "No age-banded rate that excludes NSAID and aspirin users is quotable: Bedene 2022 gives subgroup C by age only in Figure 2C, and Hreinsson 2013 does not report rates by drug use. The age-banded rows include class users."}
  - {dimension: kidney, persona: adult_18_64, condition: null, reason: "Rule 20 (review blocker 1): no opened general-population source gives a rate of admission with AKI as the principal diagnosis for 18-64 or a band containing age 40. USRDS 2018 Optum (22+) and Sawhney 2018 count AKI in any position or by blood test (outcome_match false); Mwamba 2026 (France) is all ages and age-standardised; Matrisch 2023 (Germany) has age bands but does not state the diagnosis position; HCUP Statistical Brief 231 (principal-diagnosis acute renal failure by age) could not be opened (hcup-us.ahrq.gov refused the connection; the NCBI Bookshelf copy returned a CAPTCHA)."}
  - {dimension: kidney, persona: teen_12_17, condition: null, reason: "No opened source gives principal-diagnosis AKI admissions for children or teens: USRDS covers 22+ and 66+, Sawhney 2018's youngest band is <40, Mwamba 2026 is all ages and age-standardised. JAMA Netw Open 2026 pediatric AKI hospitalization study found but not opened. Applies also to child bands and under_2."}
  - {dimension: kidney, persona: pregnant, condition: null, reason: "No population incidence opened."}
  - {dimension: kidney, persona: adult_18_64, condition: kidney_disease, reason: "No opened source gives principal-diagnosis AKI admissions per person-year in people with CKD aged 18-64. USRDS 2018 CKD rates count AKI in any position (Optum 22+ CKD rates are in Figure 5.5.c except CKD with diabetes, 100.9 per 1,000); Sawhney 2018 eGFR strata use tested people as the denominator (outcome_match false)."}
  - {dimension: kidney, persona: adult_65_plus, condition: kidney_disease, reason: "Rule 20 (review blocker 1): the USRDS 2018 CKD rate (141.7 per 1,000) counts AKI in any position (outcome_match false), and the USRDS 2024 chapter gives the principal-diagnosis AKI rate only for all beneficiaries, not by CKD status."}
  - {dimension: kidney, persona: all, condition: null, medication_type: diuretics, reason: "No opened source gives hospital AKI incidence per person-year in diuretic users. Lapi 2013 reports the rate only for all antihypertensive users (recorded as blood_pressure_medications) and Table 2 gives diuretic-only users as case and control counts, not a rate. Alberta 2009-2018 gives diuretic use only as a share of hospitalizations."}
  - {dimension: cardiovascular_bp, persona: adult_18_64, condition: null, reason: "Outcome mi_stroke only (rule 24; mi and stroke rows exist for this persona): no opened source gives a combined MI-or-stroke incidence by age band that is not age-standardised. Conrad 2024 gives age-specific rates only in figures and the BMJ supplement; adding Reynolds 2017 (MI, 25-54, CVRN 2008) to Ramirez 2016 (ischemic stroke, 25-44, NIS 2010) would mix two populations, years and band edges, so it is not done. Korean NHIS 2011-2020 papers give age-specific rates only in figures; the Swedish birth-cohort study gives examples by cohort and sex only."}
  - {dimension: cardiovascular_bp, persona: adult_65_plus, condition: null, reason: "Outcome mi_stroke only, same as adult_18_64 (mi rows use Reynolds 55-74 and stroke rows Ramirez 65-84, which are not summed)."}
  - {dimension: cardiovascular_bp, persona: teen_12_17, condition: null, reason: "No source opened; events are very rare in children/teens. Applies to child bands and under_2."}
  - {dimension: cardiovascular_bp, persona: all, condition: hypertension, reason: "No opened source gives MI+stroke incidence per person-year in people with hypertension."}
  - {dimension: cardiovascular_bp, persona: all, condition: heart_disease, reason: "No opened source gives recurrent MI/stroke incidence per person-year in people with established heart disease."}
