    selection_note: "National US surveillance, fall injuries needing ED care (matches v1 outcome). Erratum (mm7028a3) corrects only the '65-74' wording in the text sentence; table values unchanged. Age-specific 65-74 rate is 2,678.2 if a younger-old row is wanted."
