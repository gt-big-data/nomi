group: baselines
compiled: 2026-11-18
# v1.1 (2026-11-18). Every row carries outcome (rule 18), outcome_match (rule 10),
# excludes_class_users (rule 15) and match_note.
#
# Rule 15 (amended 2026-11-18): a rate the source reports for the persona's whole age range is
# used (Medicare "66 and older" and MMWR "aged >=65" count as 65 and over); otherwise the source's
# narrowest band that contains the median age of the persona's US population (persona_median_ages
# below). All-ages summary rates are recorded as persona all.
#
# v1.2 (2026-11-18). Every row also carries age_standardised (rule 26: true when the source
# standardises the rate to a reference age distribution, whatever the age range; the build
# drops every true row). Rule 26 order: same-study baseline (in the relative-risk files), then a
# rate that excludes class users, then the age rule, then the larger population-based source
# between two rates for the same whole range. Rule 20: an outside AKI baseline must count AKI as
# the cause of admission (principal diagnosis). Rule 24: cardiovascular_bp rows use mi, stroke
# or mi_stroke. Rule 25: anticoagulant_bleeding rows carry stratum_population.
persona_median_ages:
  source:
    citation: "US Census Bureau, Population Division. Annual Estimates of the Resident Population by Single Year of Age and Sex for the United States: April 1, 2020 to July 1, 2024 (NC-EST2024-AGESEX-RES). Vintage 2024"
    url: "https://www2.census.gov/programs-surveys/popest/datasets/2020-2024/national/asrh/nc-est2024-agesex-res.csv"
    location: "Rows SEX=0 (both sexes), column POPESTIMATE2024, AGE 0 to 100 (100 = 100 and over)"
    quote: "Median = the single year of age at which the cumulative July 1, 2024 count first reaches half the persona's total. 18-64: total 205,798,350, half 102,899,175; cumulative through age 39 = 100,987,117, through 40 = 105,464,158 -> 40. 65+: total 61,179,918, half 30,589,959; through 72 = 29,553,401, through 73 = 32,581,330 -> 73. 12-17: total 26,038,160, half 13,019,080; through 14 = 12,603,580, through 15 = 16,967,275 -> 15. 6-11: total 24,614,710, half 12,307,355; through 8 = 12,144,172, through 9 = 16,317,136 -> 9. 2-5: total 15,162,428, half 7,581,214; through 3 = 7,458,141, through 4 = 11,281,892 -> 4. 0-1: AGE 0 = 3,615,598, AGE 1 = 3,701,824, half 3,658,711 -> 1."
  ages: {adult_18_64: 40, adult_65_plus: 73, teen_12_17: 15, child_6_11: 9, child_2_5: 4, under_2: 1}
baselines:
  # ---------------------------------------------------------------- liver
  - dimension: liver
    persona: all
    condition: null
    medication_type: null
    outcome: acute_liver_failure
    outcome_match: true
    excludes_class_users: false
    age_standardised: false
    annual_incidence: 0.0000113
    as_reported: "1.13/100 000 person-years -> 1.13 / 100,000 = 0.0000113 per person-year"
    population: "Germany, AOK statutory health insurance (26.5 million insured), 2014-2018, all ages, extrapolated to the German population; ICD/OPS-coded acute liver failure"
    source:
      citation: "Weiler N, Schlotmann A, Schnitzbauer AA, Zeuzem S, Welker MW. The Epidemiology of Acute Liver Failure. Dtsch Arztebl Int 2020;117:43-50. doi:10.3238/arztebl.2020.0043"
      url: "https://europepmc.org/article/MED/32036852"
      location: "Abstract, Results"
      quote: "The calculated incidence of ALF was 1.13/100 000 person-years, representing 4652 cases."
    selection_note: "Largest Western claims-based population estimate of acute liver failure opened. A Thai nationwide hospital database (BMC Gastroenterol 2019, PMC6348628) reported 62.9 per million per year; not chosen because coding validity and etiology mix (69% indeterminate) differ from the OTC-using Western population."
    match_note: "Outcome is coded acute liver failure, the severe end of the section-1 liver outcome, so it pairs only with relative risks whose outcome is acute_liver_failure; all ages, so persona all and rule 15's age-band rule does not apply; class users (acetaminophen) are not excluded."
  - dimension: liver
    persona: all
    condition: null
    medication_type: null
    outcome: acute_liver_injury
    outcome_match: true
    excludes_class_users: false
    age_standardised: false
    annual_incidence: 0.0000438
    as_reported: "19.1 cases per 100,000 inhabitants per year (all DILI); 22 of the 96 cases were hospitalized -> 19.1 x 22 / 96 = 4.38 per 100,000 = 0.0000438 per person-year"
    population: "Iceland, whole population, 2010-2011, prospective nationwide case collection; drug-induced liver injury (ALT >3x ULN and/or ALP >2x ULN, RUCAM causality); acetaminophen toxicity cases excluded"
    source:
      citation: "Bjornsson ES, Bergmann OM, Bjornsson HK, Kvaran RB, Olafsson S. Incidence, presentation, and outcomes in patients with drug-induced liver injury in the general population of Iceland. Gastroenterology 2013;144:1419-1425. doi:10.1053/j.gastro.2013.02.006"
      url: "https://europepmc.org/article/MED/23419359"
      location: "Abstract, Results"
      quote: "The crude annual incidence rate of DILI was 19.1 (95% confidence interval [CI], 15.4-23.3) cases per 100,000 inhabitants. ... 26 patients had jaundice (27%) and 22 patients were hospitalized (23%) for a median of 5 days (range, 2-8 days)."
    selection_note: "Only opened population-based source that states how many acute liver injury cases were hospitalized. The headline 19.1 counts all DILI, most not hospitalized, so only the hospitalized share is used (my arithmetic from the two quoted numbers). Also opened: de Abajo et al. Br J Clin Pharmacol 2004 (PMC1884531, UK GPRD 1994-99, ages 5-75): idiopathic acute liver injury referred to hospital or a consultant, 2.4 per 100,000 person-years, of which 36 of 128 (28%) were hospitalized; not used because the case base includes consultant referrals and it is older and age-restricted. Weiler 2020 is failure only."
    match_note: "Hospitalized drug-induced acute liver injury is the section-1 liver outcome at the serious level and matches the hospitalized acute liver injury cases of Donati 2016, though non-drug causes are not counted and the 22 hospitalized cases make the rate imprecise; all ages, so persona all and rule 15 does not apply; the denominator includes acetaminophen and NSAID users (only acetaminophen-toxicity cases were excluded), so excludes_class_users is false."

  # ---------------------------------------------------------------- gi_bleeding
  - dimension: gi_bleeding
    persona: adult_18_64
    condition: null
    medication_type: null
    outcome: upper_gi_bleeding
    outcome_match: true
    excludes_class_users: false
    age_standardised: false
    annual_incidence: 0.00048
    as_reported: "48 per 100,000 per year (age 40-59) -> 48 / 100,000 = 0.00048 per person-year"
    population: "Iceland, greater Reykjavik metropolitan area residents, 2010, all patients undergoing upper GI endoscopy at the National University Hospital; age band 40-59"
    source:
      citation: "Hreinsson JP, Kalaitzakis E, Gudmundsson S, Bjornsson ES. Upper gastrointestinal bleeding: incidence, etiology and outcomes in a population-based setting. Scand J Gastroenterol 2013;48:439-447. doi:10.3109/00365521.2012.763174"
      url: "https://europepmc.org/article/PMC/PMC3613943"
      location: "Table I"
      quote: "Age standardized incidence rate 18–24 30 25–39 15 40–59 48 60–79 213 80–105 570"
    selection_note: "Only opened population-based source with a tabulated age-specific UGIB incidence. Small single-year study (132 incident cases in Table I). The Dutch national registry (Bedene 2022) gives age bands only in a figure."
    match_note: "Acute upper GI bleeding needing hospital or ED care (71% admitted for the bleed, 24% bled in hospital, 5% ED only) matches the section-1 outcome; rule 15 (amended): no 18-64 rate is reported, and the US median age of 18-64 (40) falls in 40-59, so 40-59 is used; the source does not report a rate without NSAID or aspirin users (20% of bleeders took NSAIDs, 40% low-dose aspirin). Rule 26 puts a class-free rate before the age rule, so Bedene 2022 subgroup C (persona all, excludes_class_users true) is used for this dimension and outcome and the build drops this row. Table I's column is headed 'Age standardized incidence rate', but the cells are rates within each age band, not a rate standardised across bands, so age_standardised is false."
  - dimension: gi_bleeding
    persona: adult_65_plus
    condition: null
    medication_type: null
    outcome: upper_gi_bleeding
    outcome_match: true
    excludes_class_users: false
    age_standardised: false
    annual_incidence: 0.00213
    as_reported: "213 per 100,000 per year (age 60-79) -> 213 / 100,000 = 0.00213 per person-year"
    population: "Iceland, greater Reykjavik metropolitan area residents, 2010; age band 60-79"
    source:
      citation: "Hreinsson JP, Kalaitzakis E, Gudmundsson S, Bjornsson ES. Upper gastrointestinal bleeding: incidence, etiology and outcomes in a population-based setting. Scand J Gastroenterol 2013;48:439-447. doi:10.3109/00365521.2012.763174"
      url: "https://europepmc.org/article/PMC/PMC3613943"
      location: "Table I"
      quote: "Age standardized incidence rate 18–24 30 25–39 15 40–59 48 60–79 213 80–105 570"
    selection_note: "Same source and caveats as the adult_18_64 row. Amended rule 15 keeps the v1 band."
    match_note: "Same outcome as the adult_18_64 row; rule 15 (amended): no 65-and-over rate is reported, and the US median age of 65 and over (73) falls in 60-79, so 60-79 is used (80-105 is 570); NSAID and aspirin users are not excluded. Rule 26: Bedene 2022 subgroup C excludes class users and comes before the age rule, so the build drops this row. Age-band rate, not standardised (see the adult_18_64 row)."
  - dimension: gi_bleeding
    persona: all
    condition: null
    medication_type: null
    outcome: upper_gi_bleeding
    outcome_match: true
    excludes_class_users: false
    age_standardised: false
    annual_incidence: 0.0013
    as_reported: "260 per 100 000 inhabitants over 2 years (2017-2018) -> 260 / 2 = 130 per 100,000 per year = 0.0013 per person-year"
    population: "Netherlands, total population (17.47 million, all ages), 2017-2018, linked national hospital and population registries; severe UGIB (hospital admission or death)"
    source:
      citation: "Bedene A, van Dorp ELA, Rosendaal FR, Dahan A, Lijfering WM. Risk of drug-related upper gastrointestinal bleeding in the total population of the Netherlands: a time-trend analysis. BMJ Open Gastroenterol 2022;9:e000733. doi:10.1136/bmjgast-2021-000733"
      url: "https://europepmc.org/article/PMC/PMC8753354"
      location: "Results, 'Risk of severe UGIB in the four different (sub)populations'; Table 2, subgroup A"
      quote: "In the total Dutch population, the 2 years’ worth cumulative incidence of severe UGIB was 199 per 100 000 inhabitants (95% CI 197 to 201) in 2013–2014, and in 2017–2018 it was 260 per 100 000 inhabitants (95% CI 258 to 263)"
    selection_note: "Kept for the audit trail. The same table reports subgroup C (no NSAID or antithrombotic prescriptions), which rule 15 prefers; that row follows."
    match_note: "Severe UGIB (hospital admission or death, ICD-10 ulcer bleeding/perforation, haematemesis, melaena, unspecified GI haemorrhage) is the section-1 outcome; all ages, so persona all and rule 15's age-band rule does not apply; includes NSAID and antithrombotic users, and the build drops it because the source also reports the class-excluding rate."
  - dimension: gi_bleeding
    persona: all
    condition: null
    medication_type: null
    outcome: upper_gi_bleeding
    outcome_match: true
    excludes_class_users: true
    age_standardised: false
    annual_incidence: 0.000627
    as_reported: "125.42 per 100 000 inhabitants over 2 years (2017-2018, subgroup C) -> 125.42 / 2 = 62.71 per 100,000 per year = 0.000627 per person-year"
    population: "Netherlands, 12.23 million residents (all ages) who filled no prescription for an NSAID (ATC M01A) or an antithrombotic agent (B01A, which includes low-dose aspirin) in 2017-2018; severe UGIB (hospital admission or death)"
    source:
      citation: "Bedene A, van Dorp ELA, Rosendaal FR, Dahan A, Lijfering WM. Risk of drug-related upper gastrointestinal bleeding in the total population of the Netherlands: a time-trend analysis. BMJ Open Gastroenterol 2022;9:e000733. doi:10.1136/bmjgast-2021-000733"
      url: "https://europepmc.org/article/PMC/PMC8753354"
      location: "Table 2, subgroup C, 2017-2018 row, and Table 2 footnote"
      quote: "2017–2018 | 15 338 | 12 229 473 | 125.42 (123.45 to 127.42) ... (C) restricted to the group of individuals who did not receive a prescription for NSAIDs nor antithrombotic agents"
    selection_note: "Rules 15 and 26: the source reports the total population and three restricted subgroups. Subgroup C excludes both NSAID and antithrombotic (including low-dose aspirin) prescription users, the classes whose relative risks pair with this baseline. Subgroup B (no NSAID prescription only) was 236.60 per 100,000 over 2017-2018 (118.3 per year); subgroup D (no prescription for any listed risk drug, including antihypertensives and antidepressants) was 63.34 (31.7 per year), which excludes more than the ingredient's class. Most recent biennium used, halved to an annual rate."
    match_note: "Same severe UGIB outcome as subgroup A; excludes prescription NSAID and antithrombotic users, but OTC NSAID and aspirin use is not recorded, so some class users remain. Rule 26 order: no same-study baseline here, then a class-free rate comes before the age rule, so this all-ages row is used for every persona over the Hreinsson age bands (which include class users). Age detail the source reports for subgroup C: only Figure 2C ('age-specific annual cumulative incidence ... per 100 000 inhabitants' for subgroup C in eight bands 0-15, 15-25, 25-45, 45-55, 55-65, 65-75, 75-85, >=85), with no numbers in the text or tables, so no band can be quoted; the text says incidence 'increased with age', so this all-ages rate overstates the rate for children and teens and understates it for 65 and over. It is a crude cumulative incidence (events over residents), not age-standardised."

  # ---------------------------------------------------------------- kidney
  - dimension: kidney
    persona: adult_18_64
    condition: null
    medication_type: null
    outcome: aki_hospital
    outcome_match: false
    excludes_class_users: false
    age_standardised: false
    annual_incidence: 0.0089
    as_reported: "89 per 10 000/year (age 40-69, Grampian 2012) -> 89 / 10,000 = 0.0089 per person-year"
    population: "Scotland, Grampian region, all residents aged >=15, 2012 (482,444 adults); biochemistry-defined AKI episodes (KDIGO-based, hospital and community tests); age band 40-69"
    source:
      citation: "Sawhney S, Robinson HA, van der Veer SN, et al. Acute kidney injury in the UK: a replication cohort study of the variation across three regional populations. BMJ Open 2018;8:e019435. doi:10.1136/bmjopen-2017-019435"
      url: "https://europepmc.org/article/PMC/PMC6042563"
      location: "Table 3, 'People with AKI in age strata' row 40-69 years, Grampian 2012 column"
      quote: "People with AKI in age strata ≥70 years 3205 (562) 3561 (587) 3705 (572) 3785 (584) 1299 (544) 40–69 years 1765 (88) 1903 (89) 2021 (89) 1699 (89) 740 (92) <40 years 392 (22) 466 (25) 551 (29) 363 (23) 169 (19)"
    selection_note: "Kept for the audit trail (review finding B1). Replaced by the USRDS hospital-coded AKI rows."
    match_note: "Counts any biochemical AKI including community blood tests (69.9% stage 1; only 93 of 130 per 10,000 hospital-detected in Grampian 2012), broader than the section-1 serious outcome, so outcome_match is false; under amended rule 15 the band containing the 18-64 median age (40) is 40-69; class users are not excluded."
  - dimension: kidney
    persona: adult_65_plus
    condition: null
    medication_type: null
    outcome: aki_hospital
    outcome_match: false
    excludes_class_users: false
    age_standardised: false
    annual_incidence: 0.0572
    as_reported: "572 per 10 000/year (age >=70, Grampian 2012) -> 572 / 10,000 = 0.0572 per person-year"
    population: "Scotland, Grampian region residents, 2012; age band >=70; biochemistry-defined AKI"
    source:
      citation: "Sawhney S, Robinson HA, van der Veer SN, et al. Acute kidney injury in the UK: a replication cohort study of the variation across three regional populations. BMJ Open 2018;8:e019435. doi:10.1136/bmjopen-2017-019435"
      url: "https://europepmc.org/article/PMC/PMC6042563"
      location: "Table 3, 'People with AKI in age strata' row >=70 years, Grampian 2012 column"
      quote: "People with AKI in age strata ≥70 years 3205 (562) 3561 (587) 3705 (572) 3785 (584) 1299 (544)"
    selection_note: "Kept for the audit trail (review finding B1). Replaced by the USRDS hospital-coded AKI rows."
    match_note: "Biochemical AKI including community-detected and stage 1 episodes, broader than the section-1 serious outcome, so outcome_match is false; under amended rule 15 the band containing the 65-and-over median age (73) is >=70; class users are not excluded."
  - dimension: kidney
    persona: all
    condition: kidney_disease
    medication_type: null
    outcome: aki_hospital
    outcome_match: false
    excludes_class_users: false
    age_standardised: false
    annual_incidence: 0.0756
    as_reported: "756 per 10 000/year among tested people with baseline eGFR 45-59 (Grampian 2012) -> 756 / 10,000 = 0.0756 per person-year"
    population: "Scotland, Grampian 2012, residents with >=2 creatinine tests within 365 days and baseline eGFR 45-59 mL/min/1.73 m2 (CKD stage 3a); rate within tested individuals at risk"
    source:
      citation: "Sawhney S, Robinson HA, van der Veer SN, et al. Acute kidney injury in the UK: a replication cohort study of the variation across three regional populations. BMJ Open 2018;8:e019435. doi:10.1136/bmjopen-2017-019435"
      url: "https://europepmc.org/article/PMC/PMC6042563"
      location: "Table 3, 'People with AKI in eGFR strata among people with at least two tests within 365 days (rates expressed within strata of tested individuals at risk)'"
      quote: "Baseline eGFR 45–59 809 (673) 940 (496) 894 (756) 1044 (618) 323 (607) Baseline eGFR 30–44 597 (1222) 723 (1000) 661 (1282) 732 (1097) 202 (867) Baseline eGFR <30 344 (2064) 393 (1861) 303 (1781) 423 (1778) 171 (1921)"
    selection_note: "Kept for the audit trail (review finding B1). Replaced by the USRDS CKD row."
    match_note: "Biochemical AKI with a denominator of tested people rather than the population with CKD, so outcome_match is false; all ages; class users are not excluded."
  - dimension: kidney
    persona: all
    condition: null
    medication_type: null
    outcome: aki_hospital
    outcome_match: false
    excludes_class_users: false
    age_standardised: false
    annual_incidence: 0.0038
    as_reported: "3.8 per 1,000 patient years (Optum Clinformatics, aged 22+, 2016) -> 3.8 / 1,000 = 0.0038 per person-year"
    population: "United States, Optum Clinformatics commercial insurance enrollees aged 22 and older without ESRD, 2016 (mainly working-age adults); hospitalizations with an AKI diagnosis code"
    source:
      citation: "United States Renal Data System. 2018 USRDS Annual Data Report, Volume 1: CKD in the United States, Chapter 5: Acute Kidney Injury. National Institutes of Health, National Institute of Diabetes and Digestive and Kidney Diseases, Bethesda, MD, 2018"
      url: "https://www.niddk.nih.gov/-/media/Files/USRDS/2018-Previous-ADR/Volume-1/Chapter/v1_c05_aki_18_usrds.pdf"
      location: "Chapter 5, text accompanying Figure 5.3 (page 104)"
      quote: "Among Optum Clinformatics™ patients, the overall group AKI rate increased over time, peaking at 3.8 per 1,000 patient years in 2016. For the subgroup aged 66 and older, the 2011 rate was 23.7 per 1,000 patient-years and remained somewhat stable at 21.8 per 1,000 in 2016."
    selection_note: "Kept for the audit trail. Searched also: Alberta 2009-2018 (PMC12221727; creatinine-defined AKI in hospital, only <40 and >80 rates in text), Stockholm SCREAM 2017-2021 (PMC13477473; KDIGO AKI in hospital, age only as IRRs in a figure), MMWR 2000-2014 NIS trends (PMC5857198; age-standardised, no age bands), Hsu 2007 Kaiser (abstract only, no age bands)."
    match_note: "Not used (review blocker 1). Counts hospitalizations with an AKI code in any position: the chapter says AKI 'was not necessarily the primary or admitting diagnosis' and the claims 'were not limited to the primary diagnosis', so it includes AKI arising during admissions for other causes, broader than AKI as the cause of admission that rule 20 requires of an outside baseline, so outcome_match is false. Band fix: v1.1 recorded this for adult_18_64, but 22+ is not a band inside 18-64; it spans both adult personas (Table 5.1 lists 27,548 hospitalized enrollees aged 65+), so it is an all-adult summary rate and is now recorded as persona all. Unadjusted rate (Figure 5.3 title), so age_standardised is false; class users are not excluded."
  - dimension: kidney
    persona: adult_65_plus
    condition: null
    medication_type: null
    outcome: aki_hospital
    outcome_match: false
    excludes_class_users: false
    age_standardised: false
    annual_incidence: 0.044
    as_reported: "4.4% of beneficiaries aged 66+ with at least one AKI hospitalization in 2016 -> 4.4 / 100 = 0.044 per person-year (an annual proportion of people, not a rate per patient-year)"
    population: "United States, Medicare fee-for-service 5% sample, beneficiaries aged 66+ with Parts A and B, no Medicare Advantage, no ESRD, alive on January 1, 2016; at least one hospitalization with an AKI diagnosis code"
    source:
      citation: "United States Renal Data System. 2018 USRDS Annual Data Report, Volume 1: CKD in the United States, Chapter 5: Acute Kidney Injury. National Institutes of Health, National Institute of Diabetes and Digestive and Kidney Diseases, Bethesda, MD, 2018"
      url: "https://www.niddk.nih.gov/-/media/Files/USRDS/2018-Previous-ADR/Volume-1/Chapter/v1_c05_aki_18_usrds.pdf"
      location: "Chapter 5, highlights (page 99) and Figure 5.1 data source note"
      quote: "In 2016, 4.4% of Medicare fee-for-service beneficiaries experienced a hospitalization complicated by Acute Kidney Injury (AKI) ... (a) Percent with an AKI hospitalization among all Medicare patients aged 66 and older who had both Medicare Parts A & B, no Medicare Advantage plan, no ESRD by first service date from Medical Evidence form, and were alive on January 1 of year shown."
    selection_note: "Kept for the audit trail. Age-banded rates in the same chapter (page 104): 66-69 23.0, 70-74 31.3, 75-79 44.2, 80-84 62.9, 85+ 95.7 per 1,000 patient years in 2016. Non-diabetic, non-CKD Medicare patients: 27.0 per 1,000 patient-years (Figure 5.5)."
    match_note: "Not used (review blocker 1): AKI coded in any position ('a hospitalization complicated by Acute Kidney Injury'; Table 5.1 footnote: 'AKI is defined by a diagnosis code anywhere in the hospitalization claim'), which includes AKI arising after admission, so outcome_match is false; replaced by the USRDS 2024 principal-diagnosis row. Rule 15: 66 and over is the persona's whole range. Rule 26 tie-break (review major 5): the same chapter gives a second whole-range rate, Optum 66+ (21.8 per 1,000 patient-years); between two rates for the same whole range the larger population-based source is used, and the Medicare 5% sample is a random sample of all fee-for-service beneficiaries with 238,839 hospitalized beneficiaries aged 66+ in 2016, against 27,548 hospitalized Optum enrollees aged 65+ from one insurer's commercial plans (Table 5.1), so Medicare is the one recorded. Not age-standardised (an annual percentage of beneficiaries); class users are not excluded."
  - dimension: kidney
    persona: adult_65_plus
    condition: kidney_disease
    medication_type: null
    outcome: aki_hospital
    outcome_match: false
    excludes_class_users: false
    age_standardised: false
    annual_incidence: 0.1417
    as_reported: "141.7 per 1,000 patient-years (Medicare 66+, non-diabetic with CKD, 2016) -> 141.7 / 1,000 = 0.1417 per person-year"
    population: "United States, Medicare fee-for-service 5% sample aged 66+, 2016, beneficiaries with a CKD diagnosis and without diabetes; denominator is all patient-years at risk in that group (population, not tested people)"
    source:
      citation: "United States Renal Data System. 2018 USRDS Annual Data Report, Volume 1: CKD in the United States, Chapter 5: Acute Kidney Injury. National Institutes of Health, National Institute of Diabetes and Digestive and Kidney Diseases, Bethesda, MD, 2018"
      url: "https://www.niddk.nih.gov/-/media/Files/USRDS/2018-Previous-ADR/Volume-1/Chapter/v1_c05_aki_18_usrds.pdf"
      location: "Chapter 5, text accompanying Figure 5.5 (page 108)"
      quote: "Non-diabetic patients with CKD experienced an AKI incidence rate of 141.7 per 1,000 patient-years, while the rate in patients with both DM and CKD was 207.4 per 1,000."
    selection_note: "Kept for the audit trail. The non-diabetic CKD stratum is used because the profile's kidney_disease condition does not imply diabetes; the CKD-and-diabetes stratum (207.4) is higher. The text gives no age bands within CKD and no CKD rate for under 66 (Optum CKD rates are only in Figure 5.5.c, except CKD with diabetes, 100.9)."
    match_note: "Not used (review blocker 1): AKI coded in any position, like the general USRDS 2018 rows, so it includes AKI arising after admission and outcome_match is false. The USRDS 2024 chapter gives a principal-diagnosis AKI rate only for all beneficiaries, not by CKD status, so no CKD baseline with AKI as the cause of admission was found. Population denominator of Medicare beneficiaries with CKD aged 66+ (the persona's whole range); unadjusted (Figure 5.5 title), so age_standardised is false; class users are not excluded."
  - dimension: kidney
    persona: all
    condition: null
    medication_type: blood_pressure_medications
    outcome: aki_hospital
    outcome_match: true
    excludes_class_users: false
    age_standardised: false
    annual_incidence: 0.0007
    as_reported: "7/10 000 person years -> 7 / 10,000 = 0.0007 per person-year"
    population: "UK CPRD linked to Hospital Episode Statistics, 487,372 new users of any antihypertensive drug (diuretics, ACE inhibitors, ARBs, calcium channel blockers, alpha and beta blockers), 1997-2008, followed to 2010 (mean 5.9 years); first hospital admission with AKI (ICD-10 N17) in primary position"
    source:
      citation: "Lapi F, Azoulay L, Yin H, Nessim SJ, Suissa S. Concurrent use of diuretics, angiotensin converting enzyme inhibitors, and angiotensin receptor blockers with non-steroidal anti-inflammatory drugs and risk of acute kidney injury: nested case-control study. BMJ 2013;346:e8525. doi:10.1136/bmj.e8525"
      url: "https://europepmc.org/article/PMC/PMC3541472"
      location: "Results, first paragraph; Methods, 'Selection of cases and controls'"
      quote: "We identified 2215 cases of acute kidney injury during follow-up, yielding an overall incidence rate of 7/10 000 (95% confidence interval 7/10 000 to 8/10 000) person years."
    selection_note: "The base cohort of Lapi 2013, the source of the within-group NSAID plus antihypertensive relative risks, so the baseline and those risks share one population and one outcome definition. The paper gives no rate for diuretic-only or ACE inhibitor/ARB-only users, the comparators of its Table 2."
