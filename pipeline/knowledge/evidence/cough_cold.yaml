  # pregnancy_lactation
  - ingredient: pseudoephedrine
    dimension: pregnancy_lactation
    applies_to: {persona: pregnant, condition: null, medication_type: null}
    outcome_match: true
    exposure_window: community_oral
    comparator: non_use
    dose_mg_per_day: null
    match_note: "Outcome is the specific fetal harm studied (gastroschisis). Exposure is maternal use during pregnancy outside hospital, use vs non-use."
    measure: RR
    estimate: 1.51
    ci95: [1.16, 1.97]
    interval: confidence
    exposure: "use of pseudoephedrine or phenylpropanolamine during pregnancy, use vs non-use"
    population: "10 observational studies, 25,761 pregnancies; outcome gastroschisis"
    grade: meta_analysis
    source:
      citation: "Baldacci S, Santoro M, Mezzasalma L, Pierini A, Coi A. Medication use during pregnancy and the risk of gastroschisis: a systematic review and meta-analysis of observational studies. Orphanet J Rare Dis 2024;19:31"
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC10826191/"
      location: "Results, Decongestants section; Fig. 4"
      quote: "Ten studies comprising 25,761 pregnancies were included in this analysis. The pooled effect estimate showed that the use of pseudoephedrine and phenylpropanolamine during pregnancy significantly increased the RR by 1.51 (95% CI 1.16–1.97, p = 0.00)"
    selection_note: "Most recent meta-analysis for a specific fetal harm (gastroschisis). Pools pseudoephedrine with phenylpropanolamine; no pseudoephedrine-only pooled estimate reported. First-trimester subgroup RR 1.83 (1.41-2.39). For overall major malformations the largest cohort (Dor S et al. Br J Clin Pharmacol 2025;91:1834, PMID 39957013, 120 mg PSE with loratadine, n=313 exposed) found 'aRR = 0.90, 95% confidence interval [CI] 0.558-1.45'; not used because the meta-analysis ranks higher and studies the specific harm. No quantitative estimate for breastfeeding found."
  - ingredient: phenylephrine
    dimension: pregnancy_lactation
    applies_to: {persona: pregnant, condition: null, medication_type: null}
    outcome_match: true
    exposure_window: community_oral
    comparator: non_use
    dose_mg_per_day: null
    match_note: "Outcome is the specific fetal harm studied (endocardial cushion defect). Exposure is first-trimester maternal use outside hospital; comparator mothers not exposed to decongestants."
    measure: OR
    estimate: 8.0
    ci95: [2.5, 25.3]
    interval: confidence
    exposure: "first-trimester phenylephrine use (only decongestant used)"
    population: "Slone Birth Defects Study, US and Canada 1993-2010, 12,734 malformed cases and 7,606 controls; outcome endocardial cushion defect"
    grade: case_control
    source:
      citation: "Yau WP, Mitchell AA, Lin KJ, Werler MM, Hernandez-Diaz S. Use of decongestants during pregnancy and the risk of birth defects. Am J Epidemiol 2013;178:198-208"
      url: "https://pubmed.ncbi.nlm.nih.gov/23825167/"
      location: "Abstract; Table 2, endocardial cushion defect, phenylephrine only"
      quote: "phenylephrine and endocardial cushion defect (odds ratio = 8.0; 95% confidence interval: 2.5, 25.3; 4 exposed cases)"
    selection_note: "No meta-analysis or cohort found for phenylephrine in pregnancy. Largest case-control study; this was a prespecified hypothesis it confirmed. Based on 4 exposed cases. Other phenylephrine estimates in Table 2 (VSD OR 1.4, 0.7-2.9) were not significant. No breastfeeding estimate found."
  - ingredient: oxymetazoline
    dimension: pregnancy_lactation
    applies_to: {persona: pregnant, condition: null, medication_type: null}
    outcome_match: true
    exposure_window: community_oral
    comparator: non_use
    dose_mg_per_day: null
    match_note: "Outcome is the specific fetal harm studied (pyloric stenosis). Exposure is first-trimester intranasal use (the product's route) with no other decongestant; comparator mothers of non-malformed infants not exposed."
    measure: OR
    estimate: 1.8
    ci95: [0.7, 4.8]
    interval: confidence
    exposure: "first-trimester intranasal oxymetazoline use (only decongestant used)"
    population: "Slone Birth Defects Study, US and Canada 1993-2010; outcome pyloric stenosis"
    grade: case_control
    source:
      citation: "Yau WP, Mitchell AA, Lin KJ, Werler MM, Hernandez-Diaz S. Use of decongestants during pregnancy and the risk of birth defects. Am J Epidemiol 2013;178:198-208"
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC3816336/"
      location: "Table 4, pyloric stenosis, oxymetazoline only"
      quote: "Table 4, Imidazoline Derivative: Oxymetazoline Only (n = 82), Pyloric stenosis: No. 5 | % 0.7 | Adjusted OR 1.8 | 95% CI 0.7, 4.8"
    selection_note: "Only study with oxymetazoline-specific estimates. Pyloric stenosis chosen because it is the defect the authors report as associated with intranasal decongestants; oxymetazoline-only estimate used over the class estimate (1.9, 1.0-3.5). Hypothesis-generating analysis with multiple comparisons. Other Table 4 oxymetazoline cells: VSD 1.4 (0.6-3.1), cleft lip 1.4 (0.5-3.9). Table 4 confirmed 2026-11-18 from the raw PMC HTML of PMC3816336 (adjusted OR 1.8 with footnote g, adjusted for maternal race/ethnicity; 5 exposed cases). No breastfeeding estimate found."
insufficient:
  - ingredient: dextromethorphan
    dimension: serotonergic_interactions
    reason: "No incidence or relative risk of serotonin syndrome for dextromethorphan with ssri_snri or maoi found. PubMed searches (dextromethorphan serotonin syndrome antidepressant/SSRI/cohort/incidence; dextromethorphan coprescription) return only case reports (e.g. escitalopram, fluoxetine, moclobemide, PMIDs 28784915, 38569181, 40107075), reviews and a selegiline review stating interactions 'have not been reported' (Jacob 2003, PMID 12639177). Label/hard-stop handling (MAOI) applies instead."
  - ingredient: dextromethorphan
    dimension: sedation_falls
    reason: "No fall or fracture risk estimate for dextromethorphan at OTC doses found. PubMed 'dextromethorphan falls' returns only dextromethorphan-quinidine dementia agitation trials and reviews, not OTC antitussive use."
  - ingredient: dextromethorphan
    dimension: pregnancy_lactation
    reason: "Only controlled study (Einarson 2001, Chest 119:466, PMID 11171724, n=184) reports rates without a ratio: 'three major malformations (2.3%) among the babies of women who used DM in the first trimester' vs control 'five major malformations ... (2.8%)'. No RR/OR or meta-analysis found; no breastfeeding estimate."
  - ingredient: guaifenesin
    dimension: pregnancy_lactation
    reason: "No quantitative estimate found. PubMed 'guaifenesin pregnancy' (26 hits) returns a rat developmental study, case reports and a clinical-inquiry note (Silva 2007, PMID 17669294) without data; no cohort, case-control or meta-analysis with RR/OR; no breastfeeding estimate."
  - ingredient: pseudoephedrine
    dimension: anticholinergic_cognitive
    reason: "No delirium or acute confusion risk estimate found. PubMed 'pseudoephedrine AND (delirium OR confusion)' returns case reports only (PRES after oral decongestant PMID 35321464, toddler hallucinations after ingestion PMID 9270396); 'decongestant* AND delirium AND (cohort OR case-control OR meta-analysis)' returns nothing. v0 rates the base dimension 0 for all personas; its only entry is an enlarged_prostate modifier (+2, label urinary-retention warning), which is not a delirium outcome."
  - ingredient: phenylephrine
    dimension: anticholinergic_cognitive
    reason: "No delirium or acute confusion risk estimate found. PubMed 'phenylephrine AND (delirium OR confusion)' returns only intraoperative IV phenylephrine vs ephedrine postoperative-delirium trials and cohorts (e.g. PMIDs 37725759, 39068245), not oral OTC decongestant use; 'decongestant* AND delirium AND (cohort OR case-control OR meta-analysis)' returns nothing. v0 rates the base dimension 0 for all personas; its only entry is an enlarged_prostate modifier (+2, label urinary-retention warning), which is not a delirium outcome."
  - ingredient: oxymetazoline
    dimension: anticholinergic_cognitive
    reason: "No delirium or acute confusion risk estimate found. PubMed 'oxymetazoline AND (delirium OR confusion)' returns no clinical studies (pharmacology papers and a pharmacist survey only); 'decongestant* AND delirium AND (cohort OR case-control OR meta-analysis)' returns nothing. v0 rates the base dimension 0 for all personas; its only entry is an enlarged_prostate modifier (+2, label urinary-retention warning), which is not a delirium outcome."
