group: cough_cold
compiled: 2026-11-18
relative_risks:
  # cardiovascular_bp: the only study with serious events (MI or stroke) and current decongestant use
  # is a class-level case-crossover (any decongestant, ATC R01A nasal, R01B systemic, R05X). It does
  # not report estimates by ingredient, so the same class estimate is repeated for each decongestant.
  - ingredient: pseudoephedrine
    dimension: cardiovascular_bp
    applies_to: {persona: all, condition: null, medication_type: null}
    measure: OR
    estimate: 0.78
    ci95: [0.43, 1.42]
    exposure: "definite use of any decongestant (ATC R01A, R01B, R05X, any dose) in week -1 vs week -3 before the event"
    population: "incident MI or stroke, French registries 2013-2016, mainly 70 years or younger, n=2797"
    grade: case_control
    source:
      citation: "Grimaldi-Bensouda L, Begaud B, Benichou J, Nordon C, et al. Decongestant use and the risk of myocardial infarction and stroke: a case-crossover study. Sci Rep 2021;11:4160"
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC7893034/"
      location: "Table 2, All events (Stroke + MI), adjusted conditional OR"
      quote: "28 (1.0% of cases) occurring during the time window immediately preceding the event (week -1) vs. 31 (1.1%) during the reference time window (week -3); aOR: 0.78 [95%CI 0.43–1.42] (Table 2)"
    selection_note: "Class-level estimate, not pseudoephedrine-specific: exposure was 'any decongestant, corresponding to the following ATC codes: R01A, R01B, and R05X, regardless of the dose'. Only study found with MI/stroke as outcome and current OTC-type decongestant use (case-crossover, self-controlled). No meta-analysis of serious CV events exists. BP meta-analyses report only mmHg change: Salerno 2005 (Arch Intern Med 165:1686, PMID 16087815) 'Pseudoephedrine caused a small but significant increase in SBP (0.99, mm Hg; 95% CI, 0.08 to 1.90)'; in controlled hypertension 'SBP increase of similar magnitude (1.20 mm Hg; 95% CI, 0.56 to 1.84 mm Hg)'. Cochrane 2025 (CD007895.pub3, PMID 40145549) class MD SBP 0.91 mmHg (95% CI -0.57 to 2.38). No serious-event estimate for hypertension, heart_disease, thyroid_disease, diabetes or maoi modifiers was found; Table 2 strata 'Cardiovascular risk factors (> 1)' aOR 0.55 [0.18-1.63] is risk-factor count, not heart_disease, so not mapped."
  - ingredient: pseudoephedrine
    dimension: cardiovascular_bp
    applies_to: {persona: adult_65_plus, condition: null, medication_type: null}
    measure: OR
    estimate: 1.48
    ci95: [0.33, 6.72]
    exposure: "definite use of any decongestant (ATC R01A, R01B, R05X) in week -1 vs week -3"
    population: "incident MI or stroke aged 66 or older, French registries 2013-2016, n=577"
    grade: case_control
    source:
      citation: "Grimaldi-Bensouda L, et al. Decongestant use and the risk of myocardial infarction and stroke: a case-crossover study. Sci Rep 2021;11:4160"
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC7893034/"
      location: "Table 2, stratified analyses, '≥ 66 years' row, adjusted conditional OR"
      quote: "≥ 66 years | n = 577 | Definite exposure n, % | 5 (0.9%) | 3 (0.5%) | 1.33 [0.30–5.96] | 1.48 [0.33–6.72]"
    selection_note: "Class-level, exploratory stratum (Table 2 footnote '***Exploratory analysis'), 8 exposed patients; authors state results 'cannot be generalized to elderly patients over 70 years of age'. Age cut is 66, not 65."
