  - ingredient: aspirin
    dimension: gi_bleeding
    applies_to: {persona: all, condition: null, medication_type: null}
    measure: RR
    estimate: 7.5
    ci95: [5.7, 9.9]
    exposure: "current aspirin use (last 0-7 days) at 500 mg/day, vs non-use of aspirin"
    population: "Spain, hospital-based case-control, 2777 endoscopy-proven peptic ulcer UGIB cases and 5532 controls, 2001-2004"
    grade: case_control
    source:
      citation: "Lanas A, García-Rodríguez LA, Arroyo MT, et al. Risk of upper gastrointestinal ulcer bleeding associated with selective cyclo-oxygenase-2 inhibitors, traditional non-aspirin non-steroidal anti-inflammatory drugs, aspirin and combinations. Gut 2006;55(12):1731-8"
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC1856452/"
      location: "Table 5 (aspirin dose), row '500 mg', adjusted condition RR"
      quote: "500 mg | 259 | 112 | 5.6 (4.4 to 7.0) | 7.5 (5.7 to 9.9)"
    selection_note: "No meta-analysis found that reports analgesic-dose aspirin separately from low-dose aspirin; this large case-control study reports RR by daily dose. 500 mg/day is the lowest analgesic (OTC) dose category; higher OTC daily doses gave 1 g: 10.4 (6.1-17.8) and >1 g: 21.2 (8.7-51.9). Cardioprotective 100 mg/day gave 2.7 (2.0-3.6), not used."
  - ingredient: ibuprofen
    dimension: gi_bleeding
    applies_to: {persona: all, condition: null, medication_type: ssri_snri}
    measure: OR
    estimate: 4.25
    ci95: [2.82, 6.42]
    exposure: "concurrent SSRI plus NSAID use vs use of neither (joint exposure, not NSAID effect within SSRI users)"
    population: "15 case-control and 4 cohort studies, adults"
    grade: meta_analysis
    source:
      citation: "Anglin R, Yuan Y, Moayyedi P, et al. Risk of upper gastrointestinal bleeding with selective serotonin reuptake inhibitors with or without concurrent nonsteroidal anti-inflammatory use: a systematic review and meta-analysis. Am J Gastroenterol 2014;109(6):811-9"
      url: "https://pubmed.ncbi.nlm.nih.gov/24777151/"
      location: "Abstract, Results"
      quote: "The risk of upper GI bleeding was further increased with the use of both SSRI and NSAID medications (OR=4.25, 95% CI=2.82,6.42)."
    selection_note: "Only meta-analysis found reporting NSAID plus SSRI for upper GI bleeding. CAUTION: this is the joint OR versus neither drug, so it includes the SSRI's own effect (SSRI alone OR 1.66). SNRIs not studied. Class-level NSAID estimate (no ingredient-specific value in the source); applied to ibuprofen and naproxen alike."
