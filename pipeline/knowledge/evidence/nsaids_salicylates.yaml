  - ingredient: ibuprofen
    dimension: kidney
    applies_to: {persona: all, condition: null, medication_type: diuretics}
    measure: RR
    estimate: 1.46
    ci95: [0.96, 2.24]
    exposure: "NSAID added to diuretics, first 30 days of NSAID use, vs diuretics alone"
    population: "UK CPRD linked to HES, 487,372 antihypertensive users (mean age about 77), hospital-coded AKI"
    grade: case_control
    source:
      citation: "Lapi F, Azoulay L, Yin H, Nessim SJ, Suissa S. Concurrent use of diuretics, angiotensin converting enzyme inhibitors, and angiotensin receptor blockers with non-steroidal anti-inflammatory drugs and risk of acute kidney injury: nested case-control study. BMJ 2013;346:e8525"
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC3541472/"
      location: "Table 3, 'Diuretics plus NSAIDs', row 'Duration ≤30 days', adjusted rate ratio"
      quote: "Duration‡ ≤30 days | 32 (1.4) | 208 (1.0) | 1.87 (1.25 to 2.79) | 1.46 (0.96 to 2.24)"
    selection_note: "Large study with hospital-coded AKI (matches serious outcome) comparing NSAID add-on against the diuretic alone. ≤30 days row chosen to match a short OTC course; all-duration adjusted RR was 1.02 (0.81-1.28). Triple whammy (diuretic plus ACE inhibitor/ARB plus NSAID, first 30 days) was 1.82 (1.35-2.46), Table 3; not encoded as a row because applies_to takes one medication type. Dreischulte 2015 (Kidney Int, creatinine-defined AKI, not necessarily hospitalised) reported 1.64 (1.17-2.29) for NSAID with diuretics. Class-level NSAID estimate (no ingredient-specific value in the source); applied to ibuprofen and naproxen alike."
