    url: https://pubmed.ncbi.nlm.nih.gov/39492109/
    location: Abstract, Results
    quote: Taking vitamin K antagonist (VKAs) concurrently with NSAIDs was associated with a higher risk of any bleeding [odds ratio (OR) = 1.55; 95 % CI, 1.21 to 2.00; P = 0.0007), gastrointestinal bleeding (OR = 2.66; 95 % CI, 1.96 to 3.62; P < 0.00001) as well as major bleeding (OR = 1.55; 95 % CI, 1.04 to 2.30; P = 0.03).
