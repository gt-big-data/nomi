  match_note: 'Outcome is major bleeding, matching section 1; exposure is concomitant use outside hospital; comparator is VKA users without NSAIDs, so within_group with medication_type anticoagulants (VKA stratum). Population: vitamin K antagonist users (stratum_population vka_users).'
