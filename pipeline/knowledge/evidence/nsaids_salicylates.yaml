    citation: 'Castellsague J, Riera-Guardia N, Calingaert B, et al. Individual NSAIDs and upper gastrointestinal complications: a systematic review and meta-analysis of observational studies (the SOS project). Drug Saf 2012;35(12):1127-46'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3714137/
