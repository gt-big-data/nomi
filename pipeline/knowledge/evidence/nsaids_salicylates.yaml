  grade: meta_analysis
  source:
    citation: 'Anglin R, Yuan Y, Moayyedi P, et al. Risk of upper gastrointestinal bleeding with selective serotonin reuptake inhibitors with or without concurrent nonsteroidal anti-inflammatory use: a systematic review and meta-analysis. Am J Gastroenterol 2014;109(6):811-9'
    url: https://pubmed.ncbi.nlm.nih.gov/24777151/
    location: Abstract, Results
    quote: The risk of upper GI bleeding was further increased with the use of both SSRI and NSAID medications (OR=4.25, 95% CI=2.82,6.42).
  selection_note: 'Only meta-analysis found reporting NSAID plus SSRI for upper GI bleeding against non-use of both. CAUTION: this is the joint OR versus neither drug, so it includes the SSRI''s own effect (SSRI alone OR 1.66). SNRIs not studied. Haghbin et al. Dig Dis Sci 2023 (PMID 36526813) is newer but pools any GI bleeding (not upper GI) and compares SSRI plus NSAID against SSRI alone (OR 2.14, 1.52-3.02), so it does not report this outcome and comparator. Class-level NSAID estimate (no ingredient-specific value in the source); applied to ibuprofen and naproxen alike.'
