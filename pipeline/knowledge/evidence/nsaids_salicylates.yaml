    citation: 'Castellsague J, Riera-Guardia N, Calingaert B, et al. Individual NSAIDs and upper gastrointestinal complications: a systematic review and meta-analysis of observational studies (the SOS project). Drug Saf 2012;35(12):1127-46'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3714137/
    location: Results, dose analysis (text accompanying Figure 3)
    quote: For ibuprofen, RRs were 2.15 (95% CI 1.66, 2.79) for low-medium dose and 4.22 (95% CI 1.76, 10.12) for high dose.
  selection_note: 'Most recent large meta-analysis of observational studies giving ingredient-specific pooled RRs (28 studies). Both dose strata the text quotes for ibuprofen are recorded (rule 14). dose_mg_per_day [null, 1200] is the range every included study''s low-medium stratum covers (cut-offs ranged from <=1200 to <2400 mg). Dose cut-offs come from Table IV (cut-off values for low-medium vs high daily dose, by study): ibuprofen <=1200 (Castellsague 2009, Garcia Rodriguez 2007), <=1500 (Garcia Rodriguez 1994, Perez-Gutthann 1997), <1800 (Laporte 2004), <2400 (Griffin 1991), 200 (Biskupiak 2006); naproxen <=1200, <=750, <=500, <=750, <500, <=750, 220. The text says the pooled ibuprofen and naproxen RRs were essentially unchanged when the studies with different cut-offs were excluded.'
  match_note: Outcome is upper gastrointestinal complications (bleeding, perforation or obstruction) in field and database studies of serious events, which is section 1's upper GI bleeding or perforation; exposure is current use in the community; comparator is non-use of NSAIDs. Low-medium dose stratum.
