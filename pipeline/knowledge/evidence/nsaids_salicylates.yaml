relative_risks:
  - ingredient: ibuprofen
    dimension: gi_bleeding
    applies_to: {persona: all, condition: null, medication_type: null}
    measure: RR
    estimate: 2.15
    ci95: [1.66, 2.79]
    exposure: "current use, low-medium daily dose, vs non-use of NSAIDs"
    population: "cohort and case-control studies 1980-2011, general populations (Europe, North America)"
    grade: meta_analysis
    source:
      citation: "Castellsague J, Riera-Guardia N, Calingaert B, et al. Individual NSAIDs and upper gastrointestinal complications: a systematic review and meta-analysis of observational studies (the SOS project). Drug Saf 2012;35(12):1127-46"
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC3714137/"
      location: "Results, dose analysis (text accompanying Figure 3)"
      quote: "For ibuprofen, RRs were 2.15 (95% CI 1.66, 2.79) for low-medium dose and 4.22 (95% CI 1.76, 10.12) for high dose."
    selection_note: "Most recent large meta-analysis of observational studies giving ingredient-specific pooled RRs (28 studies). Low-medium daily dose estimate chosen because it matches OTC doses; the all-dose pooled RR was 1.84 (1.54-2.20)."
