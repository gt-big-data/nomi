    measure: OR
    estimate: 1.48
    ci95: [1.0, 2.26]
    exposure: "current use, any dose, for 1-7 days, vs no NSAID in the preceding year"
    population: "446,763 people (61,460 acute MI) from Quebec RAMQ (elderly), Finland, UK GPRD and Saskatchewan databases"
    grade: meta_analysis
    source:
      citation: "Bally M, Dendukuri N, Rich B, et al. Risk of acute myocardial infarction with NSAIDs in real world use: bayesian meta-analysis of individual patient data. BMJ 2017;357:j1909"
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC5423546/"
      location: "Table 2, pooled studies column, row 'Current: Any dose for 1-7 days'; CI is a 95% credible interval"
      quote: "Any dose for 1-7 days | 192 (0.1) | 1.46 (0.99 to 2.12) | NA | 1.47 (0.89 to 2.61) | 117 (0.7) | 1.41 (0.95 to 2.04) | 15 (0.1) | 1.55 (0.99 to 2.99) | 1.48 (1.00 to 2.26)"
    selection_note: "Most recent individual-patient-data meta-analysis with the largest MI case count; 1-7 day use matches a short OTC course. Outcome is MI only (not stroke or heart failure). McGettigan & Henry 2011 (PLoS Med) composite CV events gave ibuprofen 1.18 (1.11-1.25), naproxen 1.09 (1.02-1.16) for all doses and durations."
