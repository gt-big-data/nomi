    location: § M013.50(d)(2), page 16 (eCFR 21 CFR part 343 currently holds only the professional cardiovascular and rheumatologic aspirin labeling, with no OTC analgesic daily maximum)
    quote: 'For products containing acetaminophen, aspirin, or sodium salicylate identified in §§ M013.10(a), (b), and (f). Adults: Oral dosage is 325 to 650 milligrams every 4 hours or 325 to 500 milligrams every 3 hours or 650 to 1,000 milligrams every 6 hours, while symptoms persist, not to exceed 4,000 milligrams in 24 hours, or as directed by a doctor.'
