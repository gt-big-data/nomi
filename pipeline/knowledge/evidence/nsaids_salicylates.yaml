    citation: Evans JM, McGregor E, McMahon AD, et al. Non-steroidal anti-inflammatory drugs and hospitalization for acute renal failure. QJM 1995;88(8):551-7. PMID 7648241
    url: https://pubmed.ncbi.nlm.nih.gov/7648241/
    location: Abstract
    quote: When community controls were used, recent exposure to NSAIDs and previous exposure to aspirin were independently associated with hospitalization for ARF, with adjusted odds ratios of 2.20 (1.49-3.25) and 2.19 (1.46-3.30), respectively.
  selection_note: 'Rule 13 applied. Meta-analyses opened: Zhang 2017 (BMC Nephrol, 10 studies, most recent and largest general-population pool, OR 1.73) and Ungprasert 2015 (Eur J Intern Med, PMID 25862494, 5 cohort studies; abstract gives only the range 1.58-2.11 for individual NSAIDs, no quotable pooled estimate). No newer general-population meta-analysis of NSAIDs and AKI was found in PubMed (2016-2026; Calvo 2025 covers only triple-whammy combinations, Rom J Intern Med 2025 covers CKD). Zhang''s pooled outcome is not hospital AKI: per its Results, ''Half of the studies used laboratory data to define the presence of AKI'', including Murray 1990 (outpatient creatinine rises) and Lafrance 2009 (creatinine increase >50%, per the Lafrance abstract), and Leonard 2012 used GP diagnostic codes. So no meta-analysis reports a pooled estimate for hospital AKI, and rule 13 does not displace a single study. Of the general-population studies in Zhang''s Table 1 that count only hospital admissions for AKI, Evans 1995 has the largest population (420,600 Tayside residents, 207 validated cases) and is used; Perez Gutthann 1996 (hospitalisation for ARF, 28 cases, OR 4.1) is smaller. Class-level NSAID estimate (no ingredient-specific value in the source); applied to ibuprofen and naproxen alike.'
  match_note: Cases were hospitalised with a diagnostic code for ARF validated by a renal physician, which is section 1's AKI at the serious level; exposure is recent community dispensing; comparator is no recent NSAID exposure.
