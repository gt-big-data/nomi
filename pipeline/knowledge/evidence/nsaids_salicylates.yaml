  measure: OR
  estimate: 1.73
  ci95: [1.44, 2.07]
  interval: confidence
  exposure: current NSAID exposure vs non-use (random-effects pool of adjusted ORs)
  population: 10 observational studies of community-dwelling adults (UK, US, Canada, Netherlands, Australia), searched to June 2016
  grade: meta_analysis
  source:
    citation: 'Zhang X, Donnan PT, Bell S, Guthrie B. Non-steroidal anti-inflammatory drug induced acute kidney injury in the community dwelling general population and people with chronic kidney disease: systematic review and meta-analysis. BMC Nephrol 2017;18(1):256. PMID 28764659'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5540416/
    location: Abstract, Results; outcome definitions in Table 1 and Results
    quote: In the general population, the pooled odds ratio (OR) of AKI for current NSAID exposure was 1.73 (95%CI 1.44 to 2.07)
  selection_note: 'Rule 13 applied. Meta-analyses opened: Zhang 2017 (BMC Nephrol, 10 studies, most recent and largest general-population pool, OR 1.73) and Ungprasert 2015 (Eur J Intern Med, PMID 25862494, 5 cohort studies; abstract gives only the range 1.58-2.11 for individual NSAIDs, no quotable pooled estimate). No newer general-population meta-analysis of NSAIDs and AKI was found in PubMed (2016-2026; Calvo 2025 covers only triple-whammy combinations, Rom J Intern Med 2025 covers CKD). Zhang''s pooled outcome is not hospital AKI: per its Results, ''Half of the studies used laboratory data to define the presence of AKI'', including Murray 1990 (outpatient creatinine rises) and Lafrance 2009 (creatinine increase >50%, per the Lafrance abstract), and Leonard 2012 used GP diagnostic codes. So no meta-analysis reports a pooled estimate for hospital AKI, and rule 13 does not displace a single study. Of the general-population studies in Zhang''s Table 1 that count only hospital admissions for AKI, Evans 1995 has the largest population (420,600 Tayside residents, 207 validated cases) and is used; Perez Gutthann 1996 (hospitalisation for ARF, 28 cases, OR 4.1) is smaller. Class-level NSAID estimate (no ingredient-specific value in the source); applied to ibuprofen and naproxen alike. Rule 20: meta-analysis; the source reports no incidence in non-users.'
  match_note: 'Outcome does not match rule 10: the pool mixes hospital-admission AKI with laboratory-defined AKI (half of the 10 studies) and GP-coded AKI, so it is broader than hospital AKI. Exposure is current community use; comparator non-use.'
- ingredient: ibuprofen
  dimension: kidney
  applies_to: {persona: all, condition: null, medication_type: null}
  outcome: aki_hospital
  outcome_match: true
  exposure_window: community_oral
  comparator: non_use
  dose_mg_per_day: null
  measure: OR
  estimate: 2.2
  ci95: [1.49, 3.25]
  interval: confidence
  exposure: dispensed oral NSAID in the 90 days before the index date (recent exposure) vs no recent exposure; community controls
  population: Tayside, Scotland, record-linkage population of 420,600; 207 hospitalised ARF cases validated by a renal physician, 1990-1992
  grade: case_control
  source:
    citation: Evans JM, McGregor E, McMahon AD, et al. Non-steroidal anti-inflammatory drugs and hospitalization for acute renal failure. QJM 1995;88(8):551-7. PMID 7648241
    url: https://pubmed.ncbi.nlm.nih.gov/7648241/
    location: Abstract
    quote: When community controls were used, recent exposure to NSAIDs and previous exposure to aspirin were independently associated with hospitalization for ARF, with adjusted odds ratios of 2.20 (1.49-3.25) and 2.19 (1.46-3.30), respectively.
  unexposed_incidence:
    annual_incidence: 0.000185
    as_reported: '207 validated hospitalised ARF cases among 420,600 residents; the database population is resident since May 1990 and cases were collected between 1990 and 1992, taken as May 1990 to December 1992 = 32 months = 2.67 years. 207 / 420,600 / 2.67 = 0.000185 per person-year. This is the whole study population, NSAID users included: the abstract reports no rate for non-users alone, so it slightly overstates the unexposed rate. The end month is not stated in the abstract (full text not opened).'
    location: Abstract
    quote: We conducted a case-control study using a purpose-built record-linkage database for a population of 420,600 patients, resident in Tayside since May 1990. Patients (n = 207) hospitalized with a diagnostic code for ARF between 1990 and 1992 had their diagnosis validated by a renal physician.
  selection_note: 'Rule 13 applied. Meta-analyses opened: Zhang 2017 (BMC Nephrol, 10 studies, most recent and largest general-population pool, OR 1.73) and Ungprasert 2015 (Eur J Intern Med, PMID 25862494, 5 cohort studies; abstract gives only the range 1.58-2.11 for individual NSAIDs, no quotable pooled estimate). No newer general-population meta-analysis of NSAIDs and AKI was found in PubMed (2016-2026; Calvo 2025 covers only triple-whammy combinations, Rom J Intern Med 2025 covers CKD). Zhang''s pooled outcome is not hospital AKI: per its Results, ''Half of the studies used laboratory data to define the presence of AKI'', including Murray 1990 (outpatient creatinine rises) and Lafrance 2009 (creatinine increase >50%, per the Lafrance abstract), and Leonard 2012 used GP diagnostic codes. So no meta-analysis reports a pooled estimate for hospital AKI, and rule 13 does not displace a single study. Of the general-population studies in Zhang''s Table 1 that count only hospital admissions for AKI, Evans 1995 has the largest population (420,600 Tayside residents, 207 validated cases) and is used; Perez Gutthann 1996 (hospitalisation for ARF, 28 cases, OR 4.1) is smaller. Class-level NSAID estimate (no ingredient-specific value in the source); applied to ibuprofen and naproxen alike. Rule 20: the abstract gives the case count and population (see unexposed_incidence); this is the whole-population rate, as the abstract gives no non-user rate.'
  match_note: Cases were hospitalised with a diagnostic code for ARF validated by a renal physician, which is section 1's AKI at the serious level; exposure is recent community dispensing; comparator is no recent NSAID exposure.
