insufficient:
  - ingredient: aspirin
    dimension: kidney
    reason: "no aspirin-specific AKI relative risk at analgesic doses found; searched PubMed (NSAID AKI meta-analyses, Huerta 2005, Schneider 2006, Lapi 2013 which pools aspirin with short half-life NSAIDs without a separate estimate)"
  - ingredient: aspirin
    dimension: cardiovascular_bp
    reason: "published estimates are for low-dose aspirin, which lowers MI and stroke risk; no analgesic-dose estimate of harm (MI, stroke, heart failure admission) found"
  - ingredient: aspirin
    dimension: pregnancy_lactation
    reason: "no meta-analysis or large study opened that reports analgesic-dose aspirin and a specific fetal harm; Nakhai-Pour 2011 excludes aspirin, Chen 2024 abstract does not separate aspirin; low-dose aspirin data are for preeclampsia prevention"
  - ingredient: aspirin
    dimension: anticoagulant_bleeding
    reason: "no source opened comparing aspirin plus anticoagulant against anticoagulant alone at analgesic doses; Masclee 2014 (Gastroenterology) reports only an interaction excess for low-dose aspirin with anticoagulants (RERI 1.9, no RR with CI in the abstract); Rothberg 2005 compares warfarin added to aspirin (reverse direction)"
  - ingredient: magnesium_salicylate
    dimension: gi_bleeding
    reason: "no study reports a quantitative risk for magnesium salicylate; searched PubMed and the SOS meta-analysis list"
  - ingredient: magnesium_salicylate
    dimension: kidney
    reason: "no study reports a quantitative risk for magnesium salicylate"
  - ingredient: magnesium_salicylate
    dimension: cardiovascular_bp
    reason: "no study reports a quantitative risk for magnesium salicylate"
  - ingredient: magnesium_salicylate
    dimension: pregnancy_lactation
    reason: "no study reports a quantitative risk for magnesium salicylate"
  - ingredient: magnesium_salicylate
    dimension: anticoagulant_bleeding
    reason: "no study reports a quantitative risk for magnesium salicylate with anticoagulants or antiplatelets"
  - ingredient: bismuth_subsalicylate
    dimension: pregnancy_lactation
    reason: "no study reports a quantitative fetal or neonatal risk for bismuth subsalicylate"
  - ingredient: bismuth_subsalicylate
    dimension: anticoagulant_bleeding
    reason: "label warns about anticoagulant use, but no study reports a quantitative bleeding risk for bismuth subsalicylate with anticoagulants or antiplatelets"
  - ingredient: bismuth_subsalicylate
    dimension: gi_bleeding
    reason: "no published relative risk of upper GI bleeding for bismuth subsalicylate, and no source found that explicitly maps its salicylate dose to aspirin or salicylate bleeding estimates. Searched PubMed (bismuth subsalicylate AND gastrointestinal hemorrhage OR bleeding; AND case-control OR cohort): results were case reports (warfarin interaction 2013, pediatric melena 2011) and H. pylori eradication studies, none with a risk estimate. Note: v0 file rates gi_bleeding 0 for all personas."
