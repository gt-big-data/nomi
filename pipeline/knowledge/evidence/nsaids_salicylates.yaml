  source:
    citation: 'Zhang X, Donnan PT, Bell S, Guthrie B. Non-steroidal anti-inflammatory drug induced acute kidney injury in the community dwelling general population and people with chronic kidney disease: systematic review and meta-analysis. BMC Nephrol 2017;18(1):256. PMID 28764659'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5540416/
    location: Abstract, Results; outcome definitions in Table 1 and Results
    quote: In the general population, the pooled odds ratio (OR) of AKI for current NSAID exposure was 1.73 (95%CI 1.44 to 2.07)
  selection_note: 'same moiety as ibuprofen; doses in ibuprofen mg. Rule 13 applied. Meta-analyses opened: Zhang 2017 (BMC Nephrol, 10 studies, most recent and largest general-population pool, OR 1.73) and Ungprasert 2015 (Eur J Intern Med, PMID 25862494, 5 cohort studies; abstract gives only the range 1.58-2.11 for individual NSAIDs, no quotable pooled estimate). No newer general-population meta-analysis of NSAIDs and AKI was found in PubMed (2016-2026; Calvo 2025 covers only triple-whammy combinations, Rom J Intern Med 2025 covers CKD). Zhang''s pooled outcome is not hospital AKI: per its Results, ''Half of the studies used laboratory data to define the presence of AKI'', including Murray 1990 (outpatient creatinine rises) and Lafrance 2009 (creatinine increase >50%, per the Lafrance abstract), and Leonard 2012 used GP diagnostic codes. So no meta-analysis reports a pooled estimate for hospital AKI, and rule 13 does not displace a single study. Of the general-population studies in Zhang''s Table 1 that count only hospital admissions for AKI, Evans 1995 has the largest population (420,600 Tayside residents, 207 validated cases) and is used; Perez Gutthann 1996 (hospitalisation for ARF, 28 cases, OR 4.1) is smaller. Class-level NSAID estimate (no ingredient-specific value in the source); applied to ibuprofen and naproxen alike. Rule 20: meta-analysis; the source reports no incidence in non-users.'
  match_note: 'Outcome does not match rule 10: the pool mixes hospital-admission AKI with laboratory-defined AKI (half of the 10 studies) and GP-coded AKI, so it is broader than hospital AKI. Exposure is current community use; comparator non-use.'
