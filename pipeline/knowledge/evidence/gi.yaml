    comparator: non_use
    dose_mg_per_day: null
    match_note: "Long-term: Poly 'included only the large (n >= 500) observational studies with a follow-up duration of at least one year', so the overall estimate pools exposure accumulated over years. Outcome is hip fracture (outcome id hip_fracture). Comparator is PPI non-users. The low, medium and high dose strata in the abstract (RR 1.17, 1.28, 1.30) give no mg/day ranges and come from the same long-follow-up studies. The abstract reports no incidence among non-users; the full text could not be opened (Springer login)."
    measure: RR
    estimate: 1.2
    ci95: [1.14, 1.28]
    interval: confidence
    exposure: "PPI use vs no PPI, studies with follow-up of at least one year"
    population: "24 observational studies, 2,103,800 participants (319,568 hip fracture patients), 1990-2018"
    grade: meta_analysis
    source:
      citation: "Poly TN et al. Osteoporos Int 2019;30(1):103-114"
      url: "https://pubmed.ncbi.nlm.nih.gov/30539272/"
      location: "Abstract, Results"
      quote: "Patients with PPIs had a greater risk of hip fracture than those without PPI therapy (RR 1.20, 95% CI 1.14-1.28, p < 0.0001)."
    selection_note: "Class-level PPI estimate. Most recent hip-fracture meta-analysis with the largest population (2.1M). Overall estimate kept for the audit trail; the short-term stratum of the same abstract is recorded separately. Mechanism is bone/calcium absorption, not sedation."
  - ingredient: omeprazole
    dimension: sedation_falls
    applies_to: {persona: all, condition: null, medication_type: null}
    outcome: hip_fracture
    outcome_match: true
