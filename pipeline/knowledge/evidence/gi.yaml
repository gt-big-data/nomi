      url: "https://pubmed.ncbi.nlm.nih.gov/30539272/"
      location: "Abstract, Results"
      quote: "Moreover, the overall pooled risk ratios were 1.20 (95% CI 1.15-1.25, p < 0.0001) and 1.24 (95% CI 1.10-1.40, p < 0.0001) for the patients with short- and long-term PPI therapy, respectively, compared with PPI non-users."
