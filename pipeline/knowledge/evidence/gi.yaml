group: gi
compiled: 2026-11-18
relative_risks:
  - ingredient: omeprazole
    dimension: kidney
    applies_to: {persona: all, condition: null, medication_type: null}
    measure: RR
    estimate: 1.44
    ci95: [1.08, 1.91]
    exposure: "PPI use vs non-use (pooled observational definitions; mostly prescription use, not limited to short courses)"
    population: "4 cohort and 5 case-control studies, about 2.6 million patients (534,003 PPI users), searched to Oct 2016"
    grade: meta_analysis
    source:
      citation: "Nochaiwong S et al. Nephrol Dial Transplant 2018;33(2):331-342"
      url: "https://pubmed.ncbi.nlm.nih.gov/28339835/"
      location: "Abstract, Results"
      quote: "Compared with non-PPI users, PPI users experienced a significantly higher risk of AKI [RR 1.44 (95% CI 1.08-1.91); P = 0.013; SOE, low]"
    selection_note: "Class-level PPI estimate. Largest dedicated meta-analysis of PPI and AKI found (~2.6M patients); umbrella reviews (Salvo 2021, PMID 34114655) cite RR 1.61 (1.16-2.22, n=2,396,640) from a smaller pooled population. Exposure mismatch: included studies mostly measured prescription PPI use over months to years, not a 10-day OTC course. GRADE strength of evidence low."
  - ingredient: omeprazole
    dimension: kidney
    applies_to: {persona: adult_65_plus, condition: null, medication_type: null}
    measure: HR
    estimate: 2.52
    ci95: [2.27, 2.79]
    exposure: "PPI initiation (new prescription); hospital admission with AKI within 120 days"
    population: "Ontario residents aged 66+ starting a PPI 2002-2011, 290,592 initiators vs propensity-matched controls"
    grade: cohort
    source:
      citation: "Antoniou T et al. CMAJ Open 2015;3(2):E166-71"
      url: "https://pubmed.ncbi.nlm.nih.gov/26389094/"
      location: "Abstract, Results"
      quote: "The rates of acute kidney injury (13.49 v. 5.46 per 1000 person-years, respectively; hazard ratio [HR] 2.52, 95% CI 2.27 to 2.79)"
    selection_note: "Class-level PPI estimate. No meta-analysis reports an age-stratified AKI estimate; this is the largest cohort in older adults. Outcome is hospital admission with AKI (matches v1). 120-day window after initiation is closer to a short course than multi-year studies, but still longer than 10 days and prescription doses."
  - ingredient: omeprazole
    dimension: kidney
    applies_to: {persona: all, condition: kidney_disease, medication_type: null}
    measure: HR
    estimate: 2.89
    ci95: [1.91, 4.38]
    exposure: "new PPI prescription as time-dependent variable; median cumulative prescription 1 year"
    population: "CKD-REIN cohort, France: 1,940 nephrology outpatients with CKD stages 2-5 (eGFR >= 15) not using PPI at baseline"
    grade: cohort
    source:
      citation: "Liabeuf S et al. Br J Clin Pharmacol 2021;87(7):2967-2976"
      url: "https://pubmed.ncbi.nlm.nih.gov/33368448/"
      location: "Abstract, Results"
      quote: "The adjusted HR for AKI associated with PPI prescription was 2.89 (95% CI, 1.91-4.38)."
    selection_note: "Class-level PPI estimate. Only CKD-specific AKI estimate found. Exposure mismatch: long-term prescription use (median 1 year), not a 10-day OTC course. Abstract does not state whether AKI required hospital care."
  - ingredient: omeprazole
    dimension: sedation_falls
    applies_to: {persona: all, condition: null, medication_type: null}
    measure: RR
    estimate: 1.2
    ci95: [1.14, 1.28]
    exposure: "PPI use vs no PPI (studies with follow-up >= 1 year); short-term use RR 1.20 (1.15-1.25), low dose RR 1.17 (1.05-1.29)"
    population: "24 observational studies, 2,103,800 participants (319,568 hip fracture patients), 1990-2018"
    grade: meta_analysis
    source:
      citation: "Poly TN et al. Osteoporos Int 2019;30(1):103-114"
      url: "https://pubmed.ncbi.nlm.nih.gov/30539272/"
      location: "Abstract, Results"
      quote: "Patients with PPIs had a greater risk of hip fracture than those without PPI therapy (RR 1.20, 95% CI 1.14-1.28, p < 0.0001)."
    selection_note: "Class-level PPI estimate. Most recent general-population meta-analysis with the largest population (2.1M); outcome is hip fracture only (a subset of v1 fall injury). Zhou 2016 (PMID 26462494) gives any-site RR 1.33 (1.15-1.54) in a smaller pool. Mechanism is bone/calcium absorption, not sedation; the source's short-term category is still months of use, not a 10-day course."
  - ingredient: omeprazole
    dimension: sedation_falls
    applies_to: {persona: adult_65_plus, condition: null, medication_type: null}
    measure: OR
    estimate: 1.41
    ci95: [1.31, 1.51]
    exposure: "PPI prescription vs none (crude ORs pooled)"
    population: "11 observational studies in older adults"
    grade: meta_analysis
    source:
      citation: "Robert V et al. Geriatr Nurs 2025;66(Pt A):103596"
      url: "https://pubmed.ncbi.nlm.nih.gov/40848405/"
      location: "Abstract"
      quote: "Pooled OR, calculated using a random effect model, showed a statistically significant association between PPI prescription and overall fracture risk (OR 1.41, 95 % confidence interval 1.31-1.51, P < 0.001)."
    selection_note: "Class-level PPI estimate. Only meta-analysis restricted to older adults. Pools crude (unadjusted) ORs, so confounding is not addressed; exposure is prescription use of unstated duration, not a 10-day course."
  - ingredient: omeprazole
    dimension: pregnancy_lactation
    applies_to: {persona: pregnant, condition: null, medication_type: null}
    measure: OR
    estimate: 1.28
    ci95: [1.09, 1.52]
    exposure: "maternal PPI use during pregnancy vs non-use; outcome congenital malformations"
    population: "26 observational studies (20 cohort, 6 case-control), 19 assessing PPIs, searched to June 2019"
    grade: meta_analysis
    source:
      citation: "Li CM et al. Aliment Pharmacol Ther 2020;51(4):410-420"
      url: "https://pubmed.ncbi.nlm.nih.gov/31909512/"
      location: "Abstract, Results"
      quote: "PPI use was associated with an increased risk of congenital malformations (OR 1.28, 95% CI 1.09-1.52), especially in case-control studies (OR 2.04, 1.46-2.86)."
    selection_note: "Class-level PPI estimate. Most recent and largest meta-analysis of PPI pregnancy outcomes found; supersedes Gill 2009. Authors note power was insufficient for specific drugs or malformations. Applies to pregnant persona only; no lactation estimate found."
  - ingredient: omeprazole
    dimension: anticoagulant_bleeding
    applies_to: {persona: all, condition: null, medication_type: anticoagulants}
    measure: IRR
    estimate: 0.66
    ci95: [0.62, 0.69]
    exposure: "oral anticoagulant treatment with vs without PPI cotherapy; hospitalization for upper GI bleeding"
    population: "Medicare beneficiaries 2011-2015, 1,643,123 patients starting apixaban, dabigatran, rivaroxaban or warfarin (mean age 76.4)"
    grade: cohort
    source:
      citation: "Ray WA et al. JAMA 2018;320(21):2221-2230"
      url: "https://pubmed.ncbi.nlm.nih.gov/30512099/"
      location: "Abstract, Results"
      quote: "risk of upper gastrointestinal tract bleeding hospitalizations (n = 2245) was lower overall (IRR, 0.66 [95% CI, 0.62-0.69])"
    selection_note: "Class-level PPI estimate. Largest study of PPI cotherapy with anticoagulants; PPIs are protective (IRR < 1), so this gives 0 points. v0 modifier for anticoagulants is therefore not supported as a harm."
  - ingredient: omeprazole
    dimension: cardiovascular_bp
    applies_to: {persona: all, condition: null, medication_type: antiplatelets}
    measure: RR
    estimate: 1.08
    ci95: [0.78, 1.5]
    exposure: "PPI (98% omeprazole or esomeprazole) added to clopidogrel vs clopidogrel without PPI; composite cardiovascular events"
    population: "4 RCTs, 4,341 patients on clopidogrel (96% also on aspirin)"
    grade: meta_analysis
    source:
      citation: "Axelsson MAB et al. Basic Clin Pharmacol Toxicol 2025;137(2):e70087"
      url: "https://pubmed.ncbi.nlm.nih.gov/40685887/"
      location: "Abstract"
      quote: "Regarding efficacy with or without a PPI, the pooled risk ratio (RR) and risk difference (RD) were 1.08 (95% confidence interval (CI) 0.78; 1.50)"
    selection_note: "Most recent meta-analysis of RCTs on the clopidogrel-PPI interaction, restricted to low risk-of-bias trials; (es)omeprazole specifically. Exposure is prescription PPI over the trial duration with clopidogrel. Not significant."
  - ingredient: omeprazole
    dimension: anticholinergic_cognitive
    applies_to: {persona: all, condition: null, medication_type: null}
    measure: RR
    estimate: 1.15
    ci95: [1.07, 1.24]
    exposure: "PPI administered during a medical ICU encounter (no H2RA) vs neither drug; ICD-based delirium"
    population: "6,645 adults admitted to one US academic medical ICU 2015-2019 (45% aged 65+)"
    grade: cohort
    source:
      citation: "Shiddapur A et al. Crit Care Explor 2021;3(8):e0507"
      url: "https://pubmed.ncbi.nlm.nih.gov/34396144/"
      location: "Abstract, Results"
      quote: "compared with controls receiving neither medication, after controlling for mechanical ventilation and age (risk ratio, 1.36; 1.25-1.47; p < 0.001) and (risk ratio, 1.15; 1.07-1.24; p < 0.001, respectively)"
    selection_note: "Class-level PPI estimate (second figure in quote is PPI). Only quantitative delirium estimate found. Strong mismatch: critically ill ICU patients, mostly IV stress-ulcer prophylaxis, adjusted only for ventilation and age; does not represent OTC use."
  - ingredient: esomeprazole
    dimension: kidney
    applies_to: {persona: all, condition: null, medication_type: null}
    measure: RR
