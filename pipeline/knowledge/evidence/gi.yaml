    outcome: fracture
    outcome_match: true
    exposure_window: long_term
    comparator: non_use
    dose_mg_per_day: null
    match_note: "Long-term under rule 11 read strictly. Nassar states 'The classifications used either for low, medium, and high intensity or for short, medium, and long duration were those of individual studies' authors which are reported in Table 1'. Table 1 (image, read in this session) gives the short categories as days to years: 0-292 days (Lenihan), 0-3 months (Pouwels), 2-99 days (Abrahamsen), 0-1 year (Targownik, Yang, Gray) and 1-3 years (Corley). So the short stratum includes exposure defined by up to 1 to 3 years of use, within studies whose follow-up 'was 73.12 ... months (range, 12-150 months)'. Outcome is any-site fracture (fracture). The source reports fracture incidence of '15.57% ... in 833,254 controls (data from 14 studies)', a cumulative proportion with no person-time for those studies, so it cannot be converted to per person-year and no unexposed_incidence is recorded."
    measure: OR
    estimate: 1.29
    ci95: [1.19, 1.4]
    interval: confidence
    exposure: "short duration PPI use (each study's own shortest category) vs non-users"
    population: "33 studies, 2,714,502 individuals, mean age 66.9 years"
    grade: meta_analysis
    source:
      citation: "Nassar Y, Richter S. Proton-pump Inhibitor Use and Fracture Risk: An Updated Systematic Review and Meta-analysis. J Bone Metab 2018;25(3):141-151"
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6135649/"
      location: "Abstract; Results section 1; Methods (classification of duration); Table 1 (image)"
      quote: "There was a trend towards increased fracture incidence from short duration use: OR 1.29 (95% CI, 1.19-1.40), medium duration use: OR 1.33 (95% CI, 1.12-1.55) and long duration use: OR 1.62 (95% CI, 1.33-1.90)."
    selection_note: "Class-level PPI estimate. Largest any-site fracture meta-analysis found (2.7M), more recent than Zhou 2016 (PMID 26462494, any-site RR 1.33 with no duration stratum in the abstract). Its overall estimate (1.28, 1.22-1.35; mean follow-up 73 months) and medium and long strata are long-term and not recorded as usable rows. Pools 85 ratios, several per study, so studies are weighted more than once."
  - ingredient: omeprazole
