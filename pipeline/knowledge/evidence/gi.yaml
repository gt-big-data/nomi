      url: "https://pubmed.ncbi.nlm.nih.gov/22887960/"
      location: "Abstract, Results"
      quote: "The adjusted ORs for PPI alone, tNSAID alone, and PPI + tNSAID exposures were 1.05 (0.97-1.14), 1.31 (1.25-1.37), and 1.33 (1.07-1.64), respectively."
