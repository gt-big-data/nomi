    reason: "kidney_disease (v0 modifier): no study reports a quantitative AKI or serious-harm risk for famotidine or H2RAs in CKD; searched PubMed for H2RA/famotidine with acute kidney injury and CKD. Label concern is renal clearance and CNS effects, not AKI."
