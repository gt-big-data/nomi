    selection_note: "Class-level PPI estimate. Only meta-analysis restricted to older adults. Pools crude (unadjusted) ORs; exposure duration and setting are not stated in the only text that could be opened."
  - ingredient: omeprazole
    dimension: sedation_falls
    applies_to: {persona: adult_65_plus, condition: null, medication_type: null}
    outcome: fall_injury
    outcome_match: false
    exposure_window: long_term
    comparator: non_use
    dose_mg_per_day: null
    match_note: "Fails rules 10 and 11. Supplementary Material S3 (forest plot, opened in this session) names the five pooled estimates: Kuschel et al 1.17 (1.09-1.25), Lewis et al (1) 1.95 (1.20-3.16), Lewis et al (2) 1.51 (1.00-2.28), Bor et al 2.59 (1.25-5.36), Thaler et al 1.92 (1.05-3.51). Table 1 gives their outcomes and exposures: Kuschel, 'Fall injury requiring hospitalization' in people >= 65 with 'Medications for peptic ulcer and GERD during 30 days before index date'; Lewis (1) 'Fall-related hospitalization' and Lewis (2) 'Self-report using a fall diary', both with 'Long-term PPI use for >= 1 year' in women >= 70; Bor, 'Nursing home residents from a single institution', outcome by 'Hospital discharge document review', no confounders; Thaler, a cross-sectional study of 'Female patients aged >= 70 years who required hospitalization after a fall', outcome 'Recurrent fall (>= 1 fall) in the past 12 months ... obtained through in-person interview'. So two of five outcomes are self- or interview-reported falls, not fall injury needing care (outcome_match false), and two estimates (40% of the weight) define exposure as a year or more of use, with one nursing-home and one inpatient population (long_term). Persona 65+ is supported for four studies (>= 65 or >= 70); Bor's ages are not stated. The article reports no fall rate among non-users."
    measure: OR
    estimate: 1.61
    ci95: [1.18, 2.2]
    interval: confidence
    exposure: "PPI use vs non-use (definitions vary by study, including use in the 30 days before the index date)"
    population: "5 studies of fall injury requiring hospitalization, within a meta-analysis of 8 observational studies (367,068 patients), mostly older adults"
    grade: meta_analysis
    source:
      citation: "Lapumnuaypol K, Thongprayoon C, Wijarnpreecha K, Tiu A, Cheungpasitporn W. Risk of fall in patients taking proton pump inhibitors: a meta-analysis. QJM 2019;112(2):115-121"
      url: "https://academic.oup.com/qjmed/article/112/2/115/5145385"
      location: "Results, sensitivity analysis; Supplementary Material S3 (forest plot of the five studies); Table 1 (full text and S3 opened at academic.oup.com)"
      quote: "The pooled OR for fall injury requiring hospitalization in patients using PPIs was 1.61 (95% CI, 1.18–2.20, I2 = 67%)."
    selection_note: "Class-level PPI estimate. Only meta-analysis of PPIs and falls found (PubMed search 2026-11-18). Its all-falls estimate (OR 1.27, 1.07-1.50) includes self-reported falls, and the hospitalized fall-injury sensitivity pool still includes self-reported falls, a nursing home, an inpatient cross-sectional study and use of a year or more, so neither is usable. The only study in the pool matching the outcome and a 30-day window (Kuschel 2015, Eur J Public Health, PMID 25085470) measures peptic ulcer and GERD medicines as a class, not PPIs, and its abstract gives no estimate, so no single-study row replaces it."
