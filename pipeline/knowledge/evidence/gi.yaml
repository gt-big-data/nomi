    measure: RR
    estimate: 1.2
    ci95: [1.15, 1.25]
    interval: confidence
    exposure: "short-term PPI therapy vs PPI non-users"
    population: "24 observational studies, 2,103,800 participants (319,568 hip fracture patients), 1990-2018"
