relative_risks:
  - ingredient: omeprazole
    dimension: kidney
    applies_to: {persona: all, condition: null, medication_type: null}
    outcome: aki_hospital
    outcome_match: false
    exposure_window: long_term
    comparator: non_use
    dose_mg_per_day: null
    match_note: "Long-term and outcome mismatch: Han pools 'PPI therapy' from 12 studies without a common exposure window and states 'we were unable to examine the risk of AKI among PPI users based on the duration of PPI use'; its Table 1 includes multi-year cohorts such as Lazarus ARIC (1996-2011) and Liabeuf (CKD-REIN, median cumulative prescription 1 year), so the pooled exposure is not current community use. The outcome is not restricted to hospital AKI: 'Ten studies included AKI patients based on the International Classification of Disease (ICD) criteria, one study included based on the Oxford Medical Information System (OXMIS), and one study was based on the Kidney Disease Improving Global Outcomes (KDIGO)', and 'Two studies used laboratory data to detect AKI'. Comparator is PPI non-use."
    measure: RR
    estimate: 1.75
    ci95: [1.4, 2.19]
    interval: confidence
    exposure: "PPI therapy vs control (pooled adjusted estimates; exposure windows and durations differ across the 12 studies)"
    population: "12 observational studies (9 cohort, 3 case-control), 2,492,125 individuals, published 2012-2022, mean age above 50 in all studies"
    grade: meta_analysis
    source:
      citation: "Han CT, Islam MM, Poly TN, Lu YC, Lin MC. A Meta-Analysis of Proton Pump Inhibitor Use and the Risk of Acute Kidney Injury: Geographical Differences and Associated Factors. J Clin Med 2023;12(7):2467"
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC10095047/"
      location: "Abstract; Section 3.3; Table 2 (all studies row)"
      quote: "The pooled adjusted RR demonstrated a significant positive association between PPI therapy and the risk of AKI (adjusted RR 1.75, 95% CI: 1.40-2.19, p < 0.001)"
    selection_note: "Class-level PPI estimate. Rule 13: the most recent meta-analysis of PPI and AKI with the largest population (2023, 2,492,125 individuals), so it supersedes Nochaiwong 2018 and Yang 2017 (PMID 28479851, 2,404,236 participants, RR 1.61, 1.16-2.22). Full text opened via Europe PMC. Fails rules 10 and 11, so it is kept for the audit trail and not used."
  - ingredient: omeprazole
    dimension: kidney
    applies_to: {persona: all, condition: null, medication_type: null}
    outcome: aki_hospital
    outcome_match: false
    exposure_window: long_term
    comparator: non_use
    dose_mg_per_day: null
    match_note: "Long-term and outcome mismatch: pools 'PPI users' vs 'non-PPI users' from 4 cohort and 5 case-control studies without restricting to current use; the cohort studies follow users for years (the same cohorts appear in Han 2023 Table 1). The abstract does not restrict AKI to hospital-treated events, so the serious-level outcome is not shown. Superseded by Han 2023 under rule 13."
    measure: RR
    estimate: 1.44
    ci95: [1.08, 1.91]
    interval: confidence
    exposure: "PPI use vs non-use (pooled observational definitions; mostly prescription use, not limited to short courses)"
    population: "4 cohort and 5 case-control studies, about 2.6 million patients (534,003 PPI users), searched to Oct 2016"
    grade: meta_analysis
    source:
      citation: "Nochaiwong S et al. Nephrol Dial Transplant 2018;33(2):331-342"
      url: "https://pubmed.ncbi.nlm.nih.gov/28339835/"
      location: "Abstract, Results"
      quote: "Compared with non-PPI users, PPI users experienced a significantly higher risk of AKI [RR 1.44 (95% CI 1.08-1.91); P = 0.013; SOE, low]"
    selection_note: "Class-level PPI estimate. Kept for the audit trail only: Han 2023 (PMC10095047) is more recent and is the rule 13 choice. The 2.6 million figure covers all kidney outcomes, not AKI alone. GRADE strength of evidence low."
