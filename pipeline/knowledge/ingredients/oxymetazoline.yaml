notes:
  Intranasal 0.05% decongestant, not ophthalmic use. Local irritation is mapped to local_skin. The
  under-6 label requires a doctor rather than stating an absolute contraindication. Enlarged-prostate
  warnings require label-level handling because adrenergic urinary retention has no matching dimension.
