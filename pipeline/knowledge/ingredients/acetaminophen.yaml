notes:
  'Acetaminophen by every route (pipeline/knowledge/README.md), including children''s liquids and
  infants'' suppositories. Pediatric ratings follow the labels that dose each age: children''s liquids
  dose ages 2 to 11, and Feverall Infants suppositories (3ade895b) dose 6 to 36 months and say "under
  6 months Do not use unless directed by a doctor", an ask-a-doctor strength line, so under_2 is 2. The
  adult tablets'' "children under 12 years ask a doctor" is a product-level limit (LABEL_OVERRIDES in
  packages/schema/tests/test_examples.py). rebound_overuse follows the duration rule, per UNII and per
  age: adults and teens 2 from the adult directions'' 10 day limit, children 2 to 11 2 from a children''s
  liquid''s 5 day limit (c13ced61; Children''s Tylenol itself has none). For under 2 the only label that
  doses that age is Feverall Infants, which has stop-use lines only, so under_2 is 0. NyQuil has no limit,
  so its reference product overrides rebound_overuse to 0.'
