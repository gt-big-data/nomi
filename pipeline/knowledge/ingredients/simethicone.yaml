notes:
  "Oral simethicone, which SPLs code as dimethicone (92RU3N3Y1O), so topical dimethicone skin protectants
  share this UNII and these ratings. No rating is above 0: simethicone is not absorbed, so the general
  pregnancy warning of 21 CFR 201.63(a) (for drugs intended for systemic absorption) does not apply and
  Gas-X (fa4a3b07-591b-4445-aa67-b17ba1e67d5c) and Infants' Mylicon (395be942-d883-4bcb-8811-6fe1521d5a92)
  carry none; the infants' drops give a dose for under 2 years."
