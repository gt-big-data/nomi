notes:
  Oral loperamide hydrochloride (the UNII on Imodium and store-brand labels). The heart alert applies
  to anyone who takes more than directed and is rated 2 for every persona; no source singles out adults
  65+. The heart disease modifier rests on "a history of abnormal heart rhythm", the closest condition
  in the schema.
