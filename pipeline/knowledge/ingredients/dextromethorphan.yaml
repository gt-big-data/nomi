notes:
  "Oral immediate-release hydrobromide, including the cited pediatric liquid; not polistirex. The
  2-to-5 band uses its most restrictive subgroup: the pediatric label prohibits use under 4. Serotonergic
  modifiers apply with interacting medicines. The overuse rating concerns supratherapeutic-dose abuse,
  not dependence at labeled doses."
