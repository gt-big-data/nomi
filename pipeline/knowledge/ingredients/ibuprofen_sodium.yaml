notes:
  Oral ibuprofen sodium (Advil, Advil Menstrual Pain), the only labels with this UNII. Rated like
  ibuprofen, except that no product is labeled for children under 12, so children get the adult warnings
  plus the "ask a doctor" pediatric rating, as for naproxen. The pregnancy quote leaves out the heading,
  which this SPL prints without a space after the comma. Neither label has a duration limit. Neither has
  a separate blood thinner line, but drug interaction and organ modifiers follow the moiety (README),
  so the anticoagulant_bleeding modifier cites the ibuprofen labels 1c1374e1 and 218f6df9.
