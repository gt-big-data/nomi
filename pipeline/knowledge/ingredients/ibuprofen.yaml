notes:
  Oral ibuprofen, including children's and infants' liquids, which carry the same stomach bleeding,
  heart attack and stroke, and kidney warnings. Children's liquids dose ages 2 to 11; the infants' drops
  dose 6 to 23 months and say under 6 months ask a doctor. Modifiers match naproxen and the Aleve reference
  product. Ibuprofen sodium (UNII RM1CE97Z4N, 2 labels in the bronze table) has no file yet.
