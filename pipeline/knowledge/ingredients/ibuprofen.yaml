notes:
  'Oral ibuprofen, including children''s and infants'' liquids, which carry the same stomach bleeding,
  heart attack and stroke, and kidney warnings. Children''s liquids dose ages 2 to 11; the infants'' drops
  dose 6 to 23 months and say under 6 months ask a doctor. Modifiers match naproxen and the Aleve reference
  product. Two labels (1c1374e1, 218f6df9) also print a blood thinner line under Ask a doctor or pharmacist,
  so there is an anticoagulant_bleeding anticoagulants +2 modifier as well as the gi_bleeding one (rubric
  owner: possible double count, as for aspirin). Under the duration rule in pipeline/knowledge/README.md,
  rebound_overuse is 2: some adult labels (26 of 757, e.g. 0607edb0) say "do not take longer than 10 days",
  and the children''s and infants'' sore throat warning says "Do not use more than 2 days". The same sentence''s
  "or administer to children under 3 years of age unless directed by doctor" is specific to sore throat
  use, and the children''s label doses ages 2 to 3, so it does not set pediatric (README). Ibuprofen sodium
  has its own file and shares the drug interaction and organ modifiers.'
