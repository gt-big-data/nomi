notes:
  Oral famotidine. Kidney disease is a clearance precaution (organ rule in pipeline/knowledge/README.md),
  so it is a modifier with no baseline. It is +3 because some labels (3 of 146, e.g. f5d5b40e) put kidney
  disease under Do not use; most say ask a doctor.
