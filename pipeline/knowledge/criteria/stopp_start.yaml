version: "3.0"
source: "stopp_start"
citation:
  document_id: "10.1093/ageing/afad156"
  title: "STOPP/START criteria for potentially inappropriate medications/prescribing omissions in older people: version 3 (2023)"
  url: "https://doi.org/10.1093/ageing/afad156"

criteria:
  - id: "stopp_v3_a3"
    criterion_code: "A3"
    section: "A: Indication of medication"
    drug_class: "multiple_classes"
    ingredients:
      - "ibuprofen"
      - "naproxen"
      - "aspirin"
      - "diphenhydramine"
      - "doxylamine"
    target_persona: "adult_65_plus"
    condition_modifier: "duplicate_class_therapy"
    recommendation: "avoid"
    risk_dimension: "gi_bleeding"
    clinical_rationale: "Concurrent scheduled administration of multiple agents within the same pharmacological class (e.g., two daily systemic NSAIDs) amplifies adverse drug toxicity without offering incremental therapeutic advantage over optimized monotherapy."
    original_reference: "STOPP v3 Section A (Indication of medication), Criterion 3"

  - id: "stopp_v3_b15"
    criterion_code: "B15"
    section: "B: Cardiovascular System"
    drug_class: "qt_prolonging_agents"
    ingredients:
      - "diphenhydramine"
      - "dimenhydrinate"
      - "famotidine"
      - "loperamide"
    target_persona: "adult_65_plus"
    condition_modifier: "qt_prolongation"
    recommendation: "avoid"
    risk_dimension: "cardiovascular_bp"
    clinical_rationale: "Prescribing agents known to prolong cardiac repolarization to individuals with documented baseline QTc interval prolongation increases the hazard of life-threatening polymorphic ventricular dysrhythmias."
    original_reference: "STOPP v3 Section B (Cardiovascular System), Criterion 15"

  - id: "stopp_v3_b17"
    criterion_code: "B17"
    section: "B: Cardiovascular System"
    drug_class: "nsaid"
    ingredients:
      - "ibuprofen"
      - "naproxen"
    target_persona: "adult_65_plus"
    condition_modifier: "vascular_disease"
    recommendation: "avoid"
    risk_dimension: "cardiovascular_bp"
    clinical_rationale: "Chronic systemic administration of non-topical NSAIDs in patients with established coronary, cerebrovascular, or peripheral vascular disease elevates the risk of arterial thrombotic events."
    original_reference: "STOPP v3 Section B (Cardiovascular System), Criterion 17"

  - id: "stopp_v3_b19"
    criterion_code: "B19"
    section: "B: Cardiovascular System"
    drug_class: "nsaid"
    ingredients:
      - "ibuprofen"
      - "naproxen"
      - "aspirin"
    target_persona: "adult_65_plus"
    condition_modifier: "heart_failure"
    recommendation: "avoid"
    risk_dimension: "cardiovascular_bp"
    clinical_rationale: "Use of systemic NSAIDs in older individuals being treated with loop diuretics for heart failure impairs renal prostaglandin synthesis, causing fluid retention and acute cardiac decompensation."
    original_reference: "STOPP v3 Section B (Cardiovascular System), Criterion 19"

  - id: "stopp_v3_c1"
    criterion_code: "C1"
    section: "C: Coagulation System"
    drug_class: "antiplatelet"
    ingredients:
      - "aspirin"
    target_persona: "adult_65_plus"
    condition_modifier: "high_dose_antiplatelet"
    recommendation: "avoid"
    risk_dimension: "gi_bleeding"
    clinical_rationale: "Long-term daily aspirin therapy exceeding 100 mg significantly increases hemorrhagic complications without evidence of superior antiplatelet efficacy over lower maintenance doses."
    original_reference: "STOPP v3 Section C (Coagulation System), Criterion 1"

  - id: "stopp_v3_c2"
    criterion_code: "C2"
    section: "C: Coagulation System"
    drug_class: "antiplatelet"
    ingredients:
      - "aspirin"
    target_persona: "adult_65_plus"
    condition_modifier: "major_bleeding_risk"
    recommendation: "avoid"
    risk_dimension: "gi_bleeding"
    clinical_rationale: "Initiating or continuing antiplatelet drugs like aspirin in patients with active high-risk bleeding states (such as uncontrolled severe hypertension, bleeding diathesis, or recent major spontaneous hemorrhage) carries an unacceptable bleeding risk."
    original_reference: "STOPP v3 Section C (Coagulation System), Criterion 2"

  - id: "stopp_v3_c3"
    criterion_code: "C3"
    section: "C: Coagulation System"
    drug_class: "antiplatelet"
    ingredients:
      - "aspirin"
    target_persona: "adult_65_plus"
    condition_modifier: "secondary_stroke_prevention"
    recommendation: "avoid"
    risk_dimension: "anticoagulant_bleeding"
    clinical_rationale: "Combining aspirin with clopidogrel beyond 4 weeks for secondary stroke prevention without recent coronary stenting or acute coronary syndrome lacks proven benefit over monotherapy while multiplying systemic bleeding events."
    original_reference: "STOPP v3 Section C (Coagulation System), Criterion 3"

  - id: "stopp_v3_c4"
    criterion_code: "C4"
    section: "C: Coagulation System"
    drug_class: "antiplatelet"
    ingredients:
      - "aspirin"
    target_persona: "adult_65_plus"
    condition_modifier: "atrial_fibrillation"
    recommendation: "avoid"
    risk_dimension: "anticoagulant_bleeding"
    clinical_rationale: "Adding an antiplatelet agent such as aspirin to oral anticoagulant regimens in chronic atrial fibrillation without specific coronary indications (e.g., recent coronary stenting) provides no added thromboembolic protection and elevates hemorrhage risk."
    original_reference: "STOPP v3 Section C (Coagulation System), Criterion 4"

  - id: "stopp_v3_c5"
    criterion_code: "C5"
    section: "C: Coagulation System"
    drug_class: "antiplatelet"
    ingredients:
      - "aspirin"
    target_persona: "adult_65_plus"
    condition_modifier: "stable_vascular_disease"
    recommendation: "avoid"
    risk_dimension: "anticoagulant_bleeding"
    clinical_rationale: "Concurrent antiplatelet agents (e.g. aspirin) and oral anticoagulants in patients with stable arterial disease show no clinical superiority over anticoagulant monotherapy and substantially raise major bleeding rates."
    original_reference: "STOPP v3 Section C (Coagulation System), Criterion 5"

  - id: "stopp_v3_c7"
    criterion_code: "C7"
    section: "C: Coagulation System"
    drug_class: "antiplatelet"
    ingredients:
      - "aspirin"
    target_persona: "adult_65_plus"
    condition_modifier: "atrial_fibrillation"
    recommendation: "avoid"
    risk_dimension: "cardiovascular_bp"
    clinical_rationale: "Relying on antiplatelet monotherapy such as aspirin as a substitute for indicated oral anticoagulants to prevent cardioembolic stroke in chronic atrial fibrillation is ineffective."
    original_reference: "STOPP v3 Section C (Coagulation System), Criterion 7"

  - id: "stopp_v3_c10"
    criterion_code: "C10"
    section: "C: Coagulation System"
    drug_class: "nsaid"
    ingredients:
      - "ibuprofen"
      - "naproxen"
      - "aspirin"
    target_persona: "adult_65_plus"
    condition_modifier: "concurrent_anticoagulant"
    recommendation: "avoid"
    risk_dimension: "anticoagulant_bleeding"
    clinical_rationale: "Co-administration of systemic NSAIDs with oral anticoagulants (vitamin K antagonists, direct thrombin inhibitors, or factor Xa inhibitors) markedly multiplies the hazard of catastrophic gastrointestinal hemorrhage."
    original_reference: "STOPP v3 Section C (Coagulation System), Criterion 10"

  - id: "stopp_v3_c16"
    criterion_code: "C16"
    section: "C: Coagulation System"
    drug_class: "antiplatelet"
    ingredients:
      - "aspirin"
    target_persona: "adult_65_plus"
    condition_modifier: "primary_cv_prevention"
    recommendation: "avoid"
    risk_dimension: "gi_bleeding"
    clinical_rationale: "Initiating or maintaining regular aspirin use for primary cardiovascular prophylaxis in older persons is unsupported by proof of net clinical benefit and exposes individuals to preventable bleeding harms."
    original_reference: "STOPP v3 Section C (Coagulation System), Criterion 16"

  - id: "stopp_v3_d14"
    criterion_code: "D14"
    section: "D: Central Nervous System"
    drug_class: "anticholinergic"
    ingredients:
      - "diphenhydramine"
      - "chlorpheniramine"
      - "doxylamine"
      - "dimenhydrinate"
      - "clemastine"
    target_persona: "adult_65_plus"
    condition_modifier: "cognitive_impairment_delirium"
    recommendation: "avoid"
    risk_dimension: "anticholinergic_cognitive"
    clinical_rationale: "Administering agents with potent muscarinic receptor blockade (including first-generation antihistamines) to older adults presenting with delirium or established dementia exacerbates cognitive impairment and confusion."
    original_reference: "STOPP v3 Section D (Central Nervous System), Criterion 14"

  - id: "stopp_v3_d20"
    criterion_code: "D20"
    section: "D: Central Nervous System"
    drug_class: "nootropics_supplements"
    ingredients:
      - "ginkgo_biloba"
      - "omega_3_fatty_acids"
      - "panax_ginseng"
      - "l_theanine"
    target_persona: "adult_65_plus"
    condition_modifier: "dementia"
    recommendation: "avoid"
    risk_dimension: "anticholinergic_cognitive"
    clinical_rationale: "Prescribing or relying upon nootropic supplements (such as Ginkgo biloba, omega-3 fatty acids, or ginseng) for dementia symptoms lacks verified clinical efficacy in controlled trials."
    original_reference: "STOPP v3 Section D (Central Nervous System), Criterion 20"

  - id: "stopp_v3_d24"
    criterion_code: "D24"
    section: "D: Central Nervous System"
    drug_class: "first_gen_antihistamine"
    ingredients:
      - "diphenhydramine"
      - "chlorpheniramine"
      - "clemastine"
      - "brompheniramine"
    target_persona: "adult_65_plus"
    condition_modifier: "allergy_or_pruritus"
    recommendation: "avoid"
    risk_dimension: "sedation_falls"
    clinical_rationale: "First-generation sedating antihistamines should not be used as primary therapy for allergic manifestations or itching due to the widespread availability of safer second-generation alternatives with reduced sedation and anticholinergic liability."
    original_reference: "STOPP v3 Section D (Central Nervous System), Criterion 24"

  - id: "stopp_v3_d25"
    criterion_code: "D25"
    section: "D: Central Nervous System"
    drug_class: "first_gen_antihistamine"
    ingredients:
      - "diphenhydramine"
      - "doxylamine"
    target_persona: "adult_65_plus"
    condition_modifier: "insomnia"
    recommendation: "avoid"
    risk_dimension: "anticholinergic_cognitive"
    clinical_rationale: "Using first-generation antihistamines as sleep aids in older people exposes individuals to significant risks of hangover daytime sedation, ataxia, cognitive blurring, and anticholinergic complications."
    original_reference: "STOPP v3 Section D (Central Nervous System), Criterion 25"

  - id: "stopp_v3_e4"
    criterion_code: "E4"
    section: "E: Renal System"
    drug_class: "nsaid"
    ingredients:
      - "ibuprofen"
      - "naproxen"
      - "aspirin"
    target_persona: "adult_65_plus"
    condition_modifier: "chronic_kidney_disease"
    recommendation: "avoid"
    risk_dimension: "kidney"
    clinical_rationale: "Administering systemic NSAIDs when estimated glomerular filtration rate is below 50 mL/min/1.73m² risks acute deterioration of kidney perfusion and accelerated progression of chronic renal failure."
    original_reference: "STOPP v3 Section E (Renal System), Criterion 4"

  - id: "stopp_v3_f2"
    criterion_code: "F2"
    section: "F: Gastrointestinal System"
    drug_class: "proton_pump_inhibitor"
    ingredients:
      - "omeprazole"
      - "esomeprazole"
      - "lansoprazole"
    target_persona: "adult_65_plus"
    condition_modifier: "uncomplicated_peptic_ulcer"
    recommendation: "caution"
    risk_dimension: "gi_bleeding"
    clinical_rationale: "Prolonged full-dose PPI therapy exceeding 8 weeks for uncomplicated peptic ulcer disease without dose reduction or step-down consideration unnecessarily prolongs drug exposure and increases susceptibility to associated adverse effects."
    original_reference: "STOPP v3 Section F (Gastrointestinal System), Criterion 2"

  - id: "stopp_v3_f3"
    criterion_code: "F3"
    section: "F: Gastrointestinal System"
    drug_class: "constipating_agents"
    ingredients:
      - "aluminum_hydroxide"
      - "ferrous_sulfate"
      - "diphenhydramine"
    target_persona: "adult_65_plus"
    condition_modifier: "chronic_constipation"
    recommendation: "avoid"
    risk_dimension: "gi_bleeding"
    clinical_rationale: "Administering agents that aggravate bowel stasis—including aluminum-containing antacids, oral iron salts, and antimuscarinics—to individuals with chronic constipation should be avoided when non-constipating options exist."
    original_reference: "STOPP v3 Section F (Gastrointestinal System), Criterion 3"

  - id: "stopp_v3_f4"
    criterion_code: "F4"
    section: "F: Gastrointestinal System"
    drug_class: "oral_iron"
    ingredients:
      - "ferrous_sulfate"
      - "ferrous_gluconate"
      - "ferrous_fumarate"
    target_persona: "adult_65_plus"
    condition_modifier: "iron_supplementation"
    recommendation: "avoid"
    risk_dimension: "gi_bleeding"
    clinical_rationale: "Daily elemental iron doses surpassing 200 mg (e.g. >600 mg daily ferrous sulfate) do not improve fractional intestinal iron uptake but significantly heighten the incidence of severe gastrointestinal distress and constipation."
    original_reference: "STOPP v3 Section F (Gastrointestinal System), Criterion 4"

  - id: "stopp_v3_f5"
    criterion_code: "F5"
    section: "F: Gastrointestinal System"
    drug_class: "gastroprotective_therapy"
    ingredients:
      - "omeprazole"
      - "famotidine"
    target_persona: "adult_65_plus"
    condition_modifier: "peptic_ulcer_history_with_corticosteroids"
    recommendation: "caution"
    risk_dimension: "gi_bleeding"
    clinical_rationale: "When systemic corticosteroids are prescribed to individuals with an ulcer or esophagitis history, omitting concurrent proton pump inhibitor gastroprotection predisposes the patient to mucosal injury relapse."
    original_reference: "STOPP v3 Section F (Gastrointestinal System), Criterion 5"

  - id: "stopp_v3_f6"
    criterion_code: "F6"
    section: "F: Gastrointestinal System"
    drug_class: "antiplatelet"
    ingredients:
      - "aspirin"
    target_persona: "adult_65_plus"
    condition_modifier: "gastric_antral_vascular_ectasia"
    recommendation: "avoid"
    risk_dimension: "gi_bleeding"
    clinical_rationale: "Use of antiplatelet therapies like aspirin in the setting of gastric antral vascular ectasia (watermelon stomach) generates a pronounced risk of recurrent severe gastrointestinal hemorrhage."
    original_reference: "STOPP v3 Section F (Gastrointestinal System), Criterion 6"

  - id: "stopp_v3_h1"
    criterion_code: "H1"
    section: "H: Musculoskeletal System"
    drug_class: "nsaid"
    ingredients:
      - "ibuprofen"
      - "naproxen"
      - "aspirin"
    target_persona: "adult_65_plus"
    condition_modifier: "peptic_ulcer_or_bleed_history"
    recommendation: "avoid"
    risk_dimension: "gi_bleeding"
    clinical_rationale: "Administering non-selective systemic NSAIDs to individuals with documented prior peptic ulcer disease or gastrointestinal bleeding without concurrent PPI or H2 receptor antagonist gastroprotection produces a high rate of ulcer recurrence."
    original_reference: "STOPP v3 Section H (Musculoskeletal System), Criterion 1"

  - id: "stopp_v3_h2"
    criterion_code: "H2"
    section: "H: Musculoskeletal System"
    drug_class: "nsaid"
    ingredients:
      - "ibuprofen"
      - "naproxen"
    target_persona: "adult_65_plus"
    condition_modifier: "severe_hypertension"
    recommendation: "avoid"
    risk_dimension: "cardiovascular_bp"
    clinical_rationale: "Systemic NSAID therapy in older adults with severe blood pressure elevation (consistently above 170 mmHg systolic and/or 100 mmHg diastolic) worsens systemic hypertension through sodium retention and loss of renal vasodilator prostaglandins."
    original_reference: "STOPP v3 Section H (Musculoskeletal System), Criterion 2"

  - id: "stopp_v3_h3"
    criterion_code: "H3"
    section: "H: Musculoskeletal System"
    drug_class: "nsaid"
    ingredients:
      - "ibuprofen"
      - "naproxen"
    target_persona: "adult_65_plus"
    condition_modifier: "osteoarthritis"
    recommendation: "avoid"
    risk_dimension: "gi_bleeding"
    clinical_rationale: "Long-term (>3 months) systemic NSAID therapy for degenerative osteoarthritis joint pain prior to assessing acetaminophen monotherapy is inappropriate given the comparable symptomatic relief and significantly lower hazard profile of paracetamol."
    original_reference: "STOPP v3 Section H (Musculoskeletal System), Criterion 3"

  - id: "stopp_v3_h6"
    criterion_code: "H6"
    section: "H: Musculoskeletal System"
    drug_class: "nsaid"
    ingredients:
      - "ibuprofen"
      - "naproxen"
    target_persona: "adult_65_plus"
    condition_modifier: "chronic_gout"
    recommendation: "avoid"
    risk_dimension: "kidney"
    clinical_rationale: "Prolonged administration (>3 months) of systemic NSAIDs for chronic gout prophylaxis is potentially inappropriate when first-line xanthine oxidase inhibitors (allopurinol, febuxostat) can be safely utilized."
    original_reference: "STOPP v3 Section H (Musculoskeletal System), Criterion 6"

  - id: "stopp_v3_h7"
    criterion_code: "H7"
    section: "H: Musculoskeletal System"
    drug_class: "nsaid"
    ingredients:
      - "ibuprofen"
      - "naproxen"
    target_persona: "adult_65_plus"
    condition_modifier: "concurrent_corticosteroids"
    recommendation: "avoid"
    risk_dimension: "gi_bleeding"
    clinical_rationale: "Concurrent administration of systemic NSAIDs alongside oral corticosteroid treatment for arthritis produces synergistic gastroduodenal mucosal injury and substantially raises peptic ulcer incidence."
    original_reference: "STOPP v3 Section H (Musculoskeletal System), Criterion 7"

  - id: "stopp_v3_k6"
    criterion_code: "K6"
    section: "K: Drug classes that predictably increase falls risk in susceptible older people"
    drug_class: "first_gen_antihistamine"
    ingredients:
      - "diphenhydramine"
      - "chlorpheniramine"
      - "doxylamine"
      - "dimenhydrinate"
    target_persona: "adult_65_plus"
    condition_modifier: "recurrent_falls"
    recommendation: "avoid"
    risk_dimension: "sedation_falls"
    clinical_rationale: "First-generation antihistamines given to older individuals with a history of recurrent falls exacerbate balance instability and sensory blunting, promoting subsequent fall and fracture episodes."
    original_reference: "STOPP v3 Section K (Drug classes that predictably increase falls risk in susceptible older people), Criterion 6"

  - id: "stopp_v3_l1"
    criterion_code: "L1"
    section: "L: Analgesic Drugs"
    drug_class: "simple_analgesics"
    ingredients:
      - "acetaminophen"
      - "ibuprofen"
      - "naproxen"
    target_persona: "adult_65_plus"
    condition_modifier: "mild_pain"
    recommendation: "caution"
    risk_dimension: "cardiovascular_bp"
    clinical_rationale: "According to the WHO analgesic ladder, simple non-opioid analgesics (acetaminophen or NSAIDs) represent essential first-line choices for mild pain before considering high-potency opioids."
    original_reference: "STOPP v3 Section L (Analgesic Drugs), Criterion 1"

  - id: "stopp_v3_l2"
    criterion_code: "L2"
    section: "L: Analgesic Drugs"
    drug_class: "laxative_co_therapy"
    ingredients:
      - "senna"
      - "bisacodyl"
      - "polyethylene_glycol"
    target_persona: "adult_65_plus"
    condition_modifier: "regular_opioid_therapy"
    recommendation: "caution"
    risk_dimension: "gi_bleeding"
    clinical_rationale: "Patients receiving daily scheduled opioid therapy require prophylactic co-administration of stimulant or osmotic laxatives to prevent severe, debilitating opioid-induced constipation."
    original_reference: "STOPP v3 Section L (Analgesic Drugs), Criterion 2"

  - id: "stopp_v3_l4"
    criterion_code: "L4"
    section: "L: Analgesic Drugs"
    drug_class: "topical_anesthetic"
    ingredients:
      - "lidocaine"
    target_persona: "adult_65_plus"
    condition_modifier: "osteoarthritis"
    recommendation: "avoid"
    risk_dimension: "sedation_falls"
    clinical_rationale: "Topical lidocaine patches applied for chronic osteoarthritis joint pain lack validated evidence of clinical efficacy for non-neuropathic degenerative musculoskeletal conditions."
    original_reference: "STOPP v3 Section L (Analgesic Drugs), Criterion 4"

  - id: "stopp_v3_l6"
    criterion_code: "L6"
    section: "L: Analgesic Drugs"
    drug_class: "analgesic_antipyretic"
    ingredients:
      - "acetaminophen"
    target_persona: "adult_65_plus"
    condition_modifier: "malnutrition_or_liver_disease"
    recommendation: "avoid"
    risk_dimension: "liver"
    clinical_rationale: "Administering paracetamol (acetaminophen) at cumulative daily dosages of 3 grams or higher to older patients with marked malnutrition (BMI < 18) or chronic hepatic impairment predisposes to toxic hepatic injury."
    original_reference: "STOPP v3 Section L (Analgesic Drugs), Criterion 6"

  - id: "stopp_v3_m1"
    criterion_code: "M1"
    section: "M: Antimuscarinic/Anticholinergic Drug Burden"
    drug_class: "anticholinergic"
    ingredients:
      - "diphenhydramine"
      - "chlorpheniramine"
      - "doxylamine"
    target_persona: "adult_65_plus"
    condition_modifier: "concurrent_anticholinergic"
    recommendation: "avoid"
    risk_dimension: "anticholinergic_cognitive"
    clinical_rationale: "Concomitant therapy involving two or more drugs carrying antimuscarinic activity (including OTC first-generation antihistamines) significantly escalates cumulative anticholinergic burden and heightens the likelihood of acute antimuscarinic toxicity."
    original_reference: "STOPP v3 Section M (Antimuscarinic/Anticholinergic Drug Burden), Criterion 1"

  - id: "start_v3_c2"
    criterion_code: "C2"
    section: "START Section C: Coagulation System"
    drug_class: "antiplatelet"
    ingredients:
      - "aspirin"
    target_persona: "adult_65_plus"
    condition_modifier: "documented_vascular_disease"
    recommendation: "consider"
    risk_dimension: "cardiovascular_bp"
    clinical_rationale: "Maintenance antiplatelet therapy—such as low-dose daily aspirin—is clinically indicated for secondary prevention in older persons with established atherosclerotic disease across coronary, cerebral, or peripheral vascular territories to decrease recurrent ischemic events."
    original_reference: "START v3 Section C (Coagulation System), Criterion 2"

  - id: "start_v3_f1"
    criterion_code: "F1"
    section: "START Section F: Gastrointestinal System"
    drug_class: "proton_pump_inhibitor"
    ingredients:
      - "omeprazole"
      - "esomeprazole"
      - "lansoprazole"
    target_persona: "adult_65_plus"
    condition_modifier: "severe_gerd_or_esophageal_stricture"
    recommendation: "consider"
    risk_dimension: "gi_bleeding"
    clinical_rationale: "Acid-suppressive therapy with a proton pump inhibitor is indicated for individuals presenting with severe gastroesophageal reflux disease or peptic esophageal strictures undergoing dilatation to facilitate mucosal healing and prevent stricture recurrence."
    original_reference: "START v3 Section F (Gastrointestinal System), Criterion 1"

  - id: "start_v3_f2"
    criterion_code: "F2"
    section: "START Section F: Gastrointestinal System"
    drug_class: "proton_pump_inhibitor"
    ingredients:
      - "omeprazole"
      - "esomeprazole"
      - "lansoprazole"
    target_persona: "adult_65_plus"
    condition_modifier: "low_dose_aspirin_with_ulcer_history"
    recommendation: "consider"
    risk_dimension: "gi_bleeding"
    clinical_rationale: "Co-prescribing gastroprotective proton pump inhibitor coverage is indicated when starting low-dose daily aspirin in patients with a prior documented history of peptic ulcer disease or erosive esophagitis to mitigate ulcer relapse and upper GI bleeding."
    original_reference: "START v3 Section F (Gastrointestinal System), Criterion 2"

  - id: "start_v3_f3"
    criterion_code: "F3"
    section: "START Section F: Gastrointestinal System"
    drug_class: "proton_pump_inhibitor"
    ingredients:
      - "omeprazole"
      - "esomeprazole"
      - "lansoprazole"
    target_persona: "adult_65_plus"
    condition_modifier: "nsaid_therapy"
    recommendation: "consider"
    risk_dimension: "gi_bleeding"
    clinical_rationale: "Prophylactic co-administration of a proton pump inhibitor is indicated in older individuals receiving either acute (<2 weeks) or chronic (>2 weeks) systemic NSAID regimens to prevent drug-induced mucosal erosions, ulceration, and gastrointestinal hemorrhage."
    original_reference: "START v3 Section F (Gastrointestinal System), Criterion 3"

  - id: "start_v3_f4"
    criterion_code: "F4"
    section: "START Section F: Gastrointestinal System"
    drug_class: "bulk_forming_laxatives_fiber"
    ingredients:
      - "methylcellulose"
      - "psyllium"
      - "wheat_dextrin"
    target_persona: "adult_65_plus"
    condition_modifier: "diverticulosis_with_constipation"
    recommendation: "consider"
    risk_dimension: "gi_bleeding"
    clinical_rationale: "Dietary bulking agents and soluble fiber supplementation (such as psyllium or methylcellulose) are indicated for symptomatic diverticular disease with concomitant chronic constipation to soften stool consistency and ease colonic transit."
    original_reference: "START v3 Section F (Gastrointestinal System), Criterion 4"

  - id: "start_v3_f5"
    criterion_code: "F5"
    section: "START Section F: Gastrointestinal System"
    drug_class: "osmotic_laxative"
    ingredients:
      - "polyethylene_glycol"
      - "sorbitol"
      - "magnesium_hydroxide"
    target_persona: "adult_65_plus"
    condition_modifier: "chronic_constipation"
    recommendation: "consider"
    risk_dimension: "gi_bleeding"
    clinical_rationale: "Scheduled osmotic laxative regimens (such as polyethylene glycol or sorbitol) are indicated for chronic persistent idiopathic or secondary benign constipation in older adults to restore regular bowel movement without stimulant-induced cramping."
    original_reference: "START v3 Section F (Gastrointestinal System), Criterion 5"

  - id: "start_v3_f6"
    criterion_code: "F6"
    section: "START Section F: Gastrointestinal System"
    drug_class: "probiotics"
    ingredients:
      - "saccharomyces_boulardii"
      - "lactobacillus_rhamnosus"
    target_persona: "adult_65_plus"
    condition_modifier: "concurrent_antibiotics"
    recommendation: "consider"
    risk_dimension: "gi_bleeding"
    clinical_rationale: "Co-administering validated probiotic formulations during systemic antibacterial therapy in non-immunocompromised older individuals is indicated to reduce the incidence of Clostridioides difficile-associated colitis and antibiotic-induced diarrhea."
    original_reference: "START v3 Section F (Gastrointestinal System), Criterion 6"

  - id: "start_v3_h2"
    criterion_code: "H2"
    section: "START Section H: Musculoskeletal System"
    drug_class: "bone_density_supplements"
    ingredients:
      - "calcium_carbonate"
      - "calcium_citrate"
      - "cholecalciferol"
    target_persona: "adult_65_plus"
    condition_modifier: "chronic_systemic_corticosteroids"
    recommendation: "consider"
    risk_dimension: "sedation_falls"
    clinical_rationale: "Co-administration of calcium and vitamin D supplementation alongside bone-protective antiresorptive agents is indicated for patients maintained on prolonged systemic corticosteroids to prevent glucocorticoid-induced osteoporosis and secondary skeletal fragility."
    original_reference: "START v3 Section H (Musculoskeletal System), Criterion 2"

  - id: "start_v3_h3"
    criterion_code: "H3"
    section: "START Section H: Musculoskeletal System"
    drug_class: "vitamin_d_supplement"
    ingredients:
      - "cholecalciferol"
      - "ergocalciferol"
    target_persona: "adult_65_plus"
    condition_modifier: "osteoporosis_or_fragility_fractures"
    recommendation: "consider"
    risk_dimension: "sedation_falls"
    clinical_rationale: "Vitamin D repletion is indicated in older individuals diagnosed with osteoporosis, low bone mineral density (T-score < -2.5), or prior osteoporotic fragility fractures to optimize bone mineralization and attenuate fracture risk."
    original_reference: "START v3 Section H (Musculoskeletal System), Criterion 3"

  - id: "start_v3_h5"
    criterion_code: "H5"
    section: "START Section H: Musculoskeletal System"
    drug_class: "vitamin_d_supplement"
    ingredients:
      - "cholecalciferol"
    target_persona: "adult_65_plus"
    condition_modifier: "vitamin_d_deficiency_with_falls_or_osteopenia"
    recommendation: "consider"
    risk_dimension: "sedation_falls"
    clinical_rationale: "Dietary cholecalciferol supplementation is indicated in older adults with laboratory-confirmed 25-hydroxyvitamin D deficiency (<20 mcg/L or <50 nmol/L) who are confined indoors, experiencing recurring falls, or demonstrating osteopenia (T-score between -1.0 and -2.5)."
    original_reference: "START v3 Section H (Musculoskeletal System), Criterion 5"

  - id: "start_v3_h9"
    criterion_code: "H9"
    section: "START Section H: Musculoskeletal System"
    drug_class: "vitamin_supplement"
    ingredients:
      - "folic_acid"
    target_persona: "adult_65_plus"
    condition_modifier: "methotrexate_therapy"
    recommendation: "consider"
    risk_dimension: "liver"
    clinical_rationale: "Daily or weekly oral folic acid supplementation is indicated for individuals on methotrexate regimens to minimize antimetabolite-induced mucosal, hematologic, and hepatic toxicity without compromising immunosuppressive efficacy."
    original_reference: "START v3 Section H (Musculoskeletal System), Criterion 9"

  - id: "start_v3_k1"
    criterion_code: "K1"
    section: "START Section K: Analgesics"
    drug_class: "simple_analgesics"
    ingredients:
      - "acetaminophen"
      - "ibuprofen"
      - "naproxen"
    target_persona: "adult_65_plus"
    condition_modifier: "step_care_pain_management"
    recommendation: "consider"
    risk_dimension: "cardiovascular_bp"
    clinical_rationale: "Simple non-opioid analgesics including acetaminophen or oral NSAIDs should be systematically evaluated as first-line pain management prior to considering opioid escalation for moderate-to-severe non-arthritic discomfort."
    original_reference: "START v3 Section K (Analgesics), Criterion 1"

  - id: "start_v3_k2"
    criterion_code: "K2"
    section: "START Section K: Analgesics"
    drug_class: "laxatives"
    ingredients:
      - "senna"
      - "bisacodyl"
      - "polyethylene_glycol"
