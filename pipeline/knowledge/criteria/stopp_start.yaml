    condition_modifier: "scheduled_opioid_therapy"
    recommendation: "consider"
    risk_dimension: "gi_bleeding"
    clinical_rationale: "Routine initiation of bowel regimens featuring stimulant or osmotic laxatives is indicated for all older patients maintained on regular non-PRN opioid analgesics to preempt opioid-induced bowel dysfunction."
    original_reference: "START v3 Section K (Analgesics), Criterion 2"

  - id: "start_v3_k3"
    criterion_code: "K3"
    section: "START Section K: Analgesics"
    drug_class: "topical_anesthetic"
    ingredients:
