    risk_dimension: "sedation_falls"
    clinical_rationale: "Application of topical lidocaine (e.g. dermal patch) is indicated as a targeted, low-systemic-risk therapy for localized neuropathic discomfort such as post-herpetic neuralgia, offering regional pain relief without systemic sedative adverse effects."
    original_reference: "START v3 Section K (Analgesics), Criterion 3"
