  - id: reyes_syndrome_warning
    ingredients:
      - aspirin
      - carbaspirin calcium
      - choline salicylate
      - magnesium salicylate
      - sodium salicylate
      - bismuth subsalicylate
    dimension: pediatric
    wording_variants:
      - "Reye's syndrome: Children and teenagers who have or are recovering from chicken pox or flu-like symptoms should not use this product."
    citations:
      - "21 CFR § 201.314(h)(1)"
      - "21 CFR § 201.66(c)(5)(ii)(A)"


  - id: diphenhydramine_duplicate_use_warning
    ingredients:
      - diphenhydramine hydrochloride
      - diphenhydramine citrate
    dimension: overdose
    wording_variants:
      - "Do not use with any other product containing diphenhydramine, even one used on skin"
    citations:
      - "21 CFR § 341.72(c)(6)(iv)"
      - "21 CFR § 341.72(c)(7)"
      - "OTC Monograph M012 § M012.72(c)(6)(iv)"
      - "OTC Monograph M012 § M012.72(c)(7)"


  - id: diphenhydramine_drowsiness_warning
    ingredients:
      - diphenhydramine citrate
      - diphenhydramine hydrochloride
      - doxylamine succinate
    dimension: drowsiness
    wording_variants:
      - "May cause marked drowsiness; alcohol, sedatives, and tranquilizers may increase the drowsiness effect. Avoid alcoholic beverages while taking this product. Do not take this product if you are taking sedatives or tranquilizers, without first consulting your doctor. Use caution when driving a motor vehicle or operating machinery."
    citations:
      - "21 CFR § 341.72(c)(4)"

    
  - id: third_trimester_warning
    ingredients:
      - aspirin
      - carbaspirin calcium
    dimension: pregnancy
    wording_variants:
      - "It is especially important not to use aspirin during the last 3 months of pregnancy unless definitely directed to do so by a doctor because it may cause problems in the unborn child or complications during delivery."
      - "It is especially important not to use carbaspirin calcium during the last 3 months of pregnancy unless definitely directed to do so by a doctor because it may cause problems in the unborn child or complications during delivery."
    citations:
      - "21 CFR § 201.63(e)"
    

  - id: maoi_dextromethorphan_warning
    ingredients:
      - dextromethorphan
      - dextromethorphan hydrobromide
    dimension: drug_interaction
    wording_variants:
      - "Do not use if you are now taking a prescription monoamine oxidase inhibitor (MAOI) (certain drugs for depression, psychiatric, or emotional conditions, or Parkinson's disease), or for 2 weeks after stopping the MAOI drug. If you do not know if your prescription drug contains an MAOI, ask a doctor or pharmacist before taking this product."
      - "Do not use in a child who is taking a prescription monoamine oxidase inhibitor (MAOI) (certain drugs for depression, psychiatric, or emotional conditions, or Parkinson's disease), or for 2 weeks after stopping the MAOI drug. If you do not know if your child's prescription drug contains an MAOI, ask a doctor or pharmacist before giving this product."
    citations:
      - "21 CFR § 341.74(c)(4)(v)"
      - "21 CFR § 341.74(c)(4)(vi)"
  

