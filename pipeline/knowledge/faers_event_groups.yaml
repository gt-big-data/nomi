# Maps MedDRA Preferred Terms (PTs) to event groups aligned with our risk dimensions.
# A reaction belongs to a group when its PT equals one of the group's pt_patterns, ignoring
# case. MedDRA uses British spelling ("haemorrhage"), and every PT here appears in the FAERS
# data. Cancers, infections and other PTs that only share a word with a group are left out.

event_groups:
  hepatic_disorders:
    dimension: liver
    description: Liver injury, hepatotoxicity, jaundice, raised liver enzymes
    pt_patterns:
      - "drug-induced liver injury"
      - "liver injury"
      - "hepatotoxicity"
      - "hepatocellular injury"
      - "hepatic cytolysis"
      - "hepatitis"
      - "hepatitis acute"
      - "hepatitis cholestatic"
      - "hepatitis fulminant"
      - "hepatic failure"
      - "acute hepatic failure"
      - "liver disorder"
      - "hepatic function abnormal"
      - "jaundice"
      - "cholestasis"
      - "hyperbilirubinaemia"
      - "blood bilirubin increased"
      - "liver function test abnormal"
      - "liver function test increased"
      - "hepatic enzyme increased"
      - "transaminases increased"
      - "hypertransaminasaemia"
      - "alanine aminotransferase increased"
      - "aspartate aminotransferase increased"

  gastrointestinal_hemorrhage:
    dimension: gi_bleeding
    description: GI bleeding and peptic ulcers
    pt_patterns:
      - "gastrointestinal haemorrhage"
      - "upper gastrointestinal haemorrhage"
      - "lower gastrointestinal haemorrhage"
      - "gastric haemorrhage"
      - "rectal haemorrhage"
      - "haematochezia"
      - "melaena"
      - "haematemesis"
      - "diarrhoea haemorrhagic"
      - "peptic ulcer haemorrhage"
      - "gastric ulcer haemorrhage"
      - "duodenal ulcer haemorrhage"
      - "gastrointestinal ulcer haemorrhage"
      - "ulcer haemorrhage"
      - "gastric ulcer perforation"
      - "gastric ulcer"
      - "duodenal ulcer"
      - "duodenal ulcer perforation"

  cardiovascular_events:
    dimension: cardiovascular_bp
    description: Heart attack, stroke, raised blood pressure, arrhythmia
    pt_patterns:
      - "myocardial infarction"
      - "acute myocardial infarction"
      - "cerebrovascular accident"
      - "ischaemic stroke"
      - "cerebral infarction"
      - "transient ischaemic attack"
      - "hypertension"
      - "hypertensive crisis"
      - "blood pressure increased"
      - "blood pressure systolic increased"
      - "cardiac arrest"
      - "arrhythmia"
      - "atrial fibrillation"
      - "tachycardia"
      - "ventricular tachycardia"
      - "bradycardia"

  renal_disorders:
    dimension: kidney
    description: Kidney injury, renal failure
    pt_patterns:
      - "acute kidney injury"
      - "renal failure"
      - "renal failure acute"
      - "chronic kidney disease"
      - "renal impairment"
      - "renal injury"
      - "renal disorder"
      - "nephropathy"
      - "nephropathy toxic"
      - "tubulointerstitial nephritis"
      - "renal tubular necrosis"
      - "blood creatinine increased"

  cognitive_impairment:
    dimension: anticholinergic_cognitive
    description: Confusion, delirium, memory impairment
    pt_patterns:
      - "confusional state"
      - "delirium"
      - "memory impairment"
      - "cognitive disorder"
      - "dementia"
      - "amnesia"
      - "disorientation"

  falls_sedation:
    dimension: sedation_falls
    description: Falls, somnolence, dizziness
    pt_patterns:
      - "fall"
      - "somnolence"
      - "sedation"
      - "dizziness"
      - "syncope"
      - "loss of consciousness"
      - "depressed level of consciousness"
      - "balance disorder"

  serotonin_syndrome:
    dimension: serotonergic_interactions
    description: Serotonin syndrome
    pt_patterns:
      - "serotonin syndrome"

  hemorrhage_coagulation:
    dimension: anticoagulant_bleeding
    description: Bleeding events, coagulation disorders, raised INR
    pt_patterns:
      - "haemorrhage"
      - "internal haemorrhage"
      - "cerebral haemorrhage"
      - "haemorrhage intracranial"
      - "subdural haematoma"
      - "subarachnoid haemorrhage"
      - "haemorrhagic stroke"
      - "haemorrhagic transformation stroke"
      - "coagulopathy"
      - "international normalised ratio increased"
      - "haematoma"
      - "epistaxis"

  pediatric_adverse_events:
    dimension: pediatric
    description: Events specific to or more common in children
    pt_patterns:
      - "reye's syndrome"
      - "growth retardation"
      - "developmental delay"
