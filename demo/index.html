<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#14211D" />
<link rel="icon" href="data:," />
<title>Nomi · OTC safety check (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
:root{--ink:#14211D;--paper:#F2F0E9;--pine:#1F5E4F;--muted:#55605B;--line:#14211D1F;--ok:#2E7449;--caution:#9A6212;--avoid:#A8261B;
--glass:rgba(247,245,239,.82);--glass-dark:rgba(255,255,255,.17);--edge:rgba(255,255,255,.55);--r-lg:24px;--r-md:14px;--r-sm:10px;
--t-fast:140ms;--t-med:240ms;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:16px/1.5 Figtree,system-ui,sans-serif;color:var(--ink);background:#0d1311;display:flex;justify-content:center}
.phone{position:relative;width:100%;max-width:430px;min-height:100dvh;overflow:hidden;background:var(--paper)}
@media(min-width:600px){body{align-items:center;padding:24px}.phone{min-height:0;height:min(900px,calc(100dvh - 48px));border-radius:40px;box-shadow:0 30px 80px rgba(0,0,0,.45)}}
h1,h2,.serif{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid #2F8F78;outline-offset:2px}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
/* scan */
#scan{background:#1A1F1C center/cover url("https://images.unsplash.com/photo-1631549916768-4119b2e5f926?w=900&q=70")}
#scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#scan::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,15,13,.55),rgba(11,15,13,.15) 40%,rgba(11,15,13,.5))}
.bar{position:relative;z-index:2;margin:calc(env(safe-area-inset-top) + 14px) 16px 0;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 18px;border-radius:18px;
background:var(--glass-dark);border:1px solid rgba(255,255,255,.32);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);color:#fff}
.brand{font-family:Fraunces,serif;font-size:22px;font-weight:600;margin-right:auto}
.chip{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.2);font-weight:600;font-size:14px}
.reticle{position:relative;z-index:2;margin:auto;width:78%;aspect-ratio:1.65;border:2px solid rgba(255,255,255,.9);border-radius:20px}
.reticle i{position:absolute;left:8%;right:8%;top:50%;height:2px;background:rgba(255,255,255,.75)}
@media(prefers-reduced-motion:no-preference){.reticle i{animation:sweep 2.4s var(--ease) infinite alternate}}
@keyframes sweep{from{top:18%}to{top:82%}}
.hint{position:relative;z-index:2;text-align:center;color:#fff;font-weight:500;margin:-8px 0 18px}
.sheet{position:relative;z-index:2;padding:20px 20px calc(env(safe-area-inset-bottom) + 22px);border-radius:28px 28px 0 0;background:var(--glass);
border-top:1px solid var(--edge);backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.sheet h2{font-size:20px;margin-bottom:12px}
.field{display:flex;align-items:center;gap:10px;height:50px;padding:0 6px 0 14px;border-radius:var(--r-md);background:#fff;border:1px solid var(--line)}
.field input{flex:1;border:0;outline:0;font:inherit;font-size:16px;background:none;min-width:0}
.go{height:40px;padding:0 16px;border-radius:var(--r-sm);background:var(--pine);color:#fff;font-weight:600;transition:transform var(--t-fast) var(--ease),opacity var(--t-fast)}
.go:active{transform:scale(.97)}
.picks{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 2px;margin:8px -2px 0;scrollbar-width:none}
.pick{flex:none;min-height:44px;padding:0 14px;border-radius:12px;background:rgba(20,33,29,.07);font-weight:600;font-size:14px;transition:background var(--t-fast)}
.pick:active{background:rgba(20,33,29,.14)}
.hits button{display:block;width:100%;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line);min-height:44px}
.hits small{display:block;color:var(--muted)}
.scanbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:12px;border-radius:var(--r-md);border:1px solid var(--line);font-weight:600}
/* result */
#result{overflow-y:auto;background:var(--paper)}
.rhead{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
background:rgba(242,240,233,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.rhead .chip{background:rgba(20,33,29,.07);margin-left:auto;color:var(--ink)}
.pad{padding:18px 20px 40px}
.prod h1{font-size:26px;line-height:1.15}
.prod p{color:var(--muted);font-size:14px;margin-top:4px}
.verdict{margin:18px 0 8px;padding:18px;border-radius:var(--r-lg);color:#fff;display:grid;grid-template-columns:1fr auto;align-items:end;gap:4px 12px}
.verdict.ok{background:var(--ok)}.verdict.caution{background:var(--caution)}.verdict.avoid{background:var(--avoid)}
.verdict .word{font-family:Fraunces,serif;font-size:40px;line-height:1;font-weight:600}
.verdict .num{font-family:"JetBrains Mono",monospace;font-size:13px;text-align:right;opacity:.9}
.verdict .sub{grid-column:1/-1;font-size:15px;opacity:.95}
.proto{font-size:13px;color:var(--muted);margin-bottom:22px}
section+section{margin-top:26px}
section>h2{font-size:19px;margin-bottom:10px}
ol.why{list-style:none;padding:0;counter-reset:w}
ol.why li{counter-increment:w;display:grid;grid-template-columns:28px 1fr auto;gap:2px 10px;padding:12px 0;border-top:1px solid var(--line)}
ol.why li::before{content:counter(w);font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--muted);padding-top:2px}
ol.why b{font-weight:600}
ol.why .pts{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);white-space:nowrap;padding-top:3px}
ol.why .pts.stop{color:var(--avoid);font-weight:600}
blockquote{grid-column:2/-1;margin-top:6px;padding:8px 10px;border-radius:var(--r-sm);background:#fff;border:1px solid var(--line);font-size:14px;color:#2b3632}
blockquote .mono{display:block;font-size:11px;margin-bottom:2px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:15px}
.facts dt{color:var(--muted)}
.model{padding:14px;border-radius:var(--r-md);background:#fff;border:1px solid var(--line);font-size:15px}
.model .bar2{height:6px;border-radius:3px;background:rgba(20,33,29,.08);overflow:hidden;margin-top:4px}
.model .bar2 span{display:block;height:100%;background:var(--pine)}
.model li{list-style:none;padding:6px 0}
.model ul{padding:0;margin-top:6px}
.alt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line);min-height:56px}
.alt small{display:block;color:var(--muted)}
.tag{flex:none;font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;color:#fff}
.tag.ok{background:var(--ok)}.tag.caution{background:var(--caution)}.tag.avoid{background:var(--avoid)}
details{border-top:1px solid var(--line);padding:12px 0}
summary{cursor:pointer;font-weight:600;min-height:28px}
details p{margin-top:8px;font-size:14px;color:#2b3632}
mark{background:#F3DFA2;border-radius:2px}
.foot{margin-top:28px;font-size:13px;color:var(--muted)}
/* profile sheet */
.scrim{position:absolute;inset:0;z-index:10;background:rgba(11,15,13,.4);display:none}
.scrim.on{display:block}
.psheet{position:absolute;left:0;right:0;bottom:0;z-index:11;max-height:88%;overflow-y:auto;padding:12px 20px calc(env(safe-area-inset-bottom) + 20px);border-radius:28px 28px 0 0;
background:var(--glass);backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);border-top:1px solid var(--edge);transform:translateY(105%);transition:transform var(--t-med) var(--ease)}
.psheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(20,33,29,.25);margin:0 auto 14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 18px}
.seg button{min-height:44px;border-radius:12px;background:rgba(20,33,29,.07);font-weight:600;font-size:14px;padding:4px}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--line);cursor:pointer}
.tog input{width:22px;height:22px;accent-color:var(--pine)}
.done{width:100%;min-height:50px;margin-top:16px;border-radius:var(--r-md);background:var(--pine);color:#fff;font-weight:600}
.err{color:var(--avoid);font-weight:600;margin-top:10px;font-size:15px}
.loading{padding:60px 20px;text-align:center;color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="phone">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
<symbol id="i-cam" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/></symbol>
</svg>

<div id="scan" class="view on">
  <video id="video" playsinline muted></video>
  <div class="bar"><span class="brand">nomi</span>
    <button class="chip" data-open-profile aria-label="Change who is taking it"><svg class="icon"><use href="#i-user"/></svg><span class="plabel">Adult</span></button></div>
  <div class="reticle" aria-hidden="true"><i></i></div>
  <p class="hint">Line up the barcode on the box</p>
  <div class="sheet">
    <h2>Or check by name or code</h2>
    <form class="field" id="form"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
      <label for="q" class="sr" style="position:absolute;left:-9999px">Product name or barcode</label>
      <input id="q" autocomplete="off" placeholder="Tylenol, Advil, or 12-digit UPC" /><button class="go">Check</button></form>
    <div class="hits" id="hits"></div>
    <p class="mono" style="margin-top:14px">Try a real label</p>
    <div class="picks" id="picks"></div>
    <button class="scanbtn" id="scanbtn"><svg class="icon" aria-hidden="true"><use href="#i-cam"/></svg>Scan with camera</button>
  </div>
</div>

<div id="result" class="view" aria-live="polite">
  <div class="rhead"><button class="iconbtn" id="back" aria-label="Back to scan"><svg class="icon"><use href="#i-back"/></svg></button>
    <span class="serif" style="font-size:18px">nomi</span>
    <button class="chip" data-open-profile aria-label="Change who is taking it"><svg class="icon"><use href="#i-user"/></svg><span class="plabel">Adult</span></button></div>
  <div class="pad" id="out"></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="psheet" id="psheet" role="dialog" aria-modal="true" aria-labelledby="ptitle">
  <div class="grab"></div>
  <h2 id="ptitle" style="font-size:22px">Who is taking it?</h2>
  <div class="seg" id="ages"></div>
  <p class="mono">Health and medicines</p>
  <div id="conds"></div>
  <button class="done" id="done">Done</button>
</div>
</div>
<script src="/app.js"></script>
</body>
</html>
